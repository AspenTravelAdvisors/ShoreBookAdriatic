<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shore Book">
<meta name="theme-color" content="#EDEAE1">
<title>Shore Book · Adriatic 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --stone:#EDEAE1;
  --sand:#FBFAF6;
  --ink:#131E28;
  --sea:#1D5A6E;
  --sea-tint:#DDE7E9;
  --rosso:#8C2F39;
  --reel:#8A6B1F;
  --rule:#C9C6BB;
  --mute:#6E7378;
  --display:"Didot","Bodoni 72",Didot LT STD,"Hoefler Text",Georgia,serif;
  --body:"Avenir Next",Avenir,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Menlo","SF Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--stone);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:620px;margin:0 auto;padding:0 18px 72px}

/* ---------- masthead ---------- */
header{padding:22px 0 0}
.kicker{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mute);display:flex;justify-content:space-between;align-items:baseline;
}
h1{
  font-family:var(--display);font-weight:400;font-size:44px;line-height:.95;
  margin:8px 0 2px;letter-spacing:-.01em;
}
.sub{font-size:13px;color:var(--mute);margin:0 0 14px}

/* ---------- port rail ---------- */
.ports{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;margin:0 -18px;
  padding-left:18px;padding-right:18px;scrollbar-width:none}
.ports::-webkit-scrollbar{display:none}
.port-btn{
  flex:0 0 auto;background:transparent;border:1px solid var(--rule);
  border-radius:2px;padding:7px 12px;font-family:var(--mono);font-size:11px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mute);cursor:pointer;
}
.port-btn[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--stone)}
.port-btn:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

/* ---------- tide bar (signature) ---------- */
.tide{border:1px solid var(--ink);background:var(--sand);padding:12px 13px 11px;margin:2px 0 18px}
.tide-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tide-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.tide-clock{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tide-clock.warn{color:var(--rosso)}
.tide-track{
  position:relative;height:16px;margin:10px 0 8px;border:1px solid var(--rule);
  background:repeating-linear-gradient(-45deg,transparent 0 4px,var(--rule) 4px 5px);
}
.tide-fill{position:absolute;inset:0 auto 0 0;background:var(--sea-tint);
  border-right:2px solid var(--sea);transition:width .6s ease}
@media (prefers-reduced-motion:reduce){.tide-fill{transition:none}}
.tide-foot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mute)}
.tide-foot input{
  font-family:var(--mono);font-size:12px;border:0;border-bottom:1px solid var(--rule);
  background:transparent;color:var(--ink);padding:1px 0;
}
.tide-foot input:focus{outline:none;border-bottom-color:var(--sea)}

/* ---------- dock strip ---------- */
.dock{border-left:3px solid var(--sea);padding:2px 0 2px 12px;margin:0 0 20px;font-size:14px}
.dock b{font-weight:600}
.dock span{display:block;color:var(--mute);font-size:13px;margin-top:2px}

/* ---------- tabs ---------- */
.tabs{display:flex;border-bottom:1px solid var(--rule);margin:0 0 18px}
.tab{
  flex:1 1 0;min-width:0;background:none;border:0;border-bottom:2px solid transparent;
  margin-bottom:-1px;padding:9px 1px;font-family:var(--mono);font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--mute);cursor:pointer;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--rosso)}
.tab:focus-visible{outline:2px solid var(--sea);outline-offset:-2px}

/* ---------- sounding rail (stops) ---------- */
.rail{position:relative;margin:0;padding:0 0 0 34px;list-style:none}
.rail::before{content:"";position:absolute;left:9px;top:10px;bottom:26px;
  width:1px;background:var(--rule)}
.stop{position:relative;padding:0 0 20px}
.dot{
  position:absolute;left:-34px;top:2px;width:19px;height:19px;border-radius:50%;
  border:1px solid var(--ink);background:var(--stone);color:var(--ink);
  font-family:var(--mono);font-size:10px;line-height:17px;text-align:center;
  cursor:pointer;padding:0;
}
.stop.done .dot{background:var(--ink);color:var(--stone)}
.stop.done .stop-name{text-decoration:line-through;color:var(--mute)}
.dot:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.stop-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  cursor:pointer}
.stop-name{font-family:var(--display);font-size:21px;line-height:1.15}
.stop-dur{font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap}
.stop-body{display:none;padding:6px 0 0}
.stop.open .stop-body{display:block}
.stop-body p{margin:0 0 8px;font-size:14.5px}
.look{border-left:2px solid var(--rosso);padding-left:10px;font-size:13.5px;color:var(--ink)}
.look b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--rosso);display:block;margin-bottom:2px;font-weight:400}
.leg{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mute);margin-top:10px}
.geo{display:inline-block;margin-top:9px;font-family:var(--mono);font-size:11px;
  color:var(--sea);text-decoration:none;border-bottom:1px solid var(--sea-tint)}
.geo+.geo{margin-left:14px}
.geo.btn{border:0;border-bottom:1px solid var(--sea-tint);background:none;padding:0;cursor:pointer}

/* ---------- projection ---------- */
.proj{border:1px dashed var(--rule);background:var(--sand);padding:11px 13px;margin:0 0 20px;
  font-size:13.5px}
.proj b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);display:block;margin-bottom:3px;font-weight:400}
.proj.tight{border-color:var(--rosso);border-style:solid}
.proj.tight strong{color:var(--rosso)}

/* ---------- lists ---------- */
.entry{border-top:1px solid var(--rule);padding:12px 0}
.entry:first-child{border-top:0}
.entry-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.entry-name{font-family:var(--display);font-size:19px}
.entry-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--sea);white-space:nowrap;border:1px solid var(--sea-tint);padding:2px 5px}
.entry p{margin:5px 0 0;font-size:14px;color:var(--ink)}
.know li{font-size:14.5px;margin-bottom:9px}
.know{padding-left:18px}

/* ---------- glyphs (shared by chart and cards) ---------- */
.gly{
  display:inline-flex;align-items:center;justify-content:center;
  width:21px;height:21px;flex:0 0 21px;margin-top:1px;
  font-family:var(--mono);font-size:10px;color:var(--sand);background:var(--ink);
}
.gly i{font-style:normal;display:block}
.gly.k-walk{border-radius:50%}
.gly.k-eat{background:var(--rosso)}
.gly.k-buy{background:var(--sea);transform:rotate(45deg)}
.gly.k-buy i{transform:rotate(-45deg)}
.gly.k-screen{background:var(--reel);border-radius:50%;
  box-shadow:inset 0 0 0 1px var(--reel), inset 0 0 0 2.4px var(--sand)}

/* ---------- cards ---------- */
.card{border:1px solid var(--rule);background:var(--sand);padding:11px 12px;margin:0 0 10px}
.card.hi{border-color:var(--ink);box-shadow:2px 2px 0 var(--rule)}
.card-head{display:flex;gap:10px;align-items:flex-start}
.card-title{flex:1;min-width:0}
.card-name{font-family:var(--display);font-size:19px;line-height:1.15;display:block}
.card-meta{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);display:block;margin-top:3px}
.card-title .entry-tag{display:inline-block;margin-top:6px;white-space:normal}
.card p{margin:7px 0 0;font-size:14px}
.card .note{color:var(--mute);font-size:13px}
.card-foot{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;margin-top:10px;
  font-family:var(--mono);font-size:10.5px}
.card-foot a,.card-foot button{color:var(--sea);text-decoration:none;border:0;background:none;
  font:inherit;padding:0;cursor:pointer;border-bottom:1px solid var(--sea-tint)}
.coord{color:var(--mute);font-family:var(--mono);font-size:10.5px}
.sec-note{font-size:12.5px;color:var(--mute);margin:0 0 14px}

/* ---------- chart ---------- */
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.lay{
  border:1px solid var(--rule);background:transparent;cursor:pointer;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);padding:5px 7px;display:inline-flex;align-items:center;gap:6px;
}
.lay[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.lay:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.sw{width:9px;height:9px;display:inline-block;background:var(--ink)}
.sw.k-walk{border-radius:50%}
.sw.k-eat{background:var(--rosso)}
.sw.k-buy{background:var(--sea);transform:rotate(45deg)}
.sw.k-screen{background:var(--reel);border-radius:50%}
.chart-frame{border:1px solid var(--ink);background:var(--sand);padding:8px;margin:0 0 12px}
.chart-frame svg{display:block;width:100%;height:auto;max-height:70vh;margin:0 auto}
.chart-empty{font-family:var(--mono);font-size:11px;color:var(--mute);text-align:center;padding:40px 0}
.off{border-top:1px solid var(--rule);margin-top:16px;padding-top:12px}
.off h3,.index h3{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mute);font-weight:400;margin:0 0 8px}
.offrow{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--rule);
  font-size:13.5px}
.offrow:first-of-type{border-top:0}
.offrow .bearing{font-family:var(--mono);font-size:10.5px;color:var(--sea);white-space:nowrap}
.offrow .oname{flex:1;min-width:0}
.offrow .osub{display:block;font-size:12px;color:var(--mute)}
.index{margin-top:16px}
.ixrow{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:none;
  border:0;border-top:1px solid var(--rule);padding:7px 0;cursor:pointer;font:inherit;color:inherit}
.ixrow:first-of-type{border-top:0}
.ixrow .ixname{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.ixrow .ixsub{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mute);white-space:nowrap}
.ixrow[aria-current="true"] .ixname{font-weight:600}

/* ---------- chart internals (inline SVG) ---------- */
.gr line{stroke:#C9C6BB;stroke-width:.4;stroke-dasharray:2 3}
.tk{font-family:Menlo,monospace;font-size:6.5px;fill:#6E7378;letter-spacing:.04em}
.frm{fill:none;stroke:#C9C6BB;stroke-width:.8}
.route{fill:none;stroke:#131E28;stroke-width:1;stroke-dasharray:4 3;opacity:.5}
.lead{stroke:#6E7378;stroke-width:.5}
.true{fill:#6E7378}
.pin{cursor:pointer}
.pin text{font-family:Menlo,monospace;font-size:9px;fill:#FBFAF6}
.pin:focus-visible{outline:none}
.pin:focus-visible .halo,.halo{fill:none;stroke:#131E28;stroke-width:1.2}
.bar line{stroke:#131E28;stroke-width:1}
.rose line{stroke:#131E28;stroke-width:.8}
.rose polygon{fill:#131E28}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--rule);margin-top:26px;padding:14px 0 0;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--mute);
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.reset{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;
  cursor:pointer;padding:0}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="kicker"><span>Shore Book</span><span id="today">—</span></div>
  <h1 id="portName">—</h1>
  <p class="sub" id="portSub">—</p>
</header>

<div class="ports" role="tablist" aria-label="Ports" id="portRail"></div>

<section class="tide" aria-live="polite">
  <div class="tide-top">
    <span class="tide-label">Back on board in</span>
    <span class="tide-clock" id="tideClock">—</span>
  </div>
  <div class="tide-track"><div class="tide-fill" id="tideFill" style="width:0%"></div></div>
  <div class="tide-foot">
    <label>Ashore <input type="time" id="ashore" step="300"></label>
    <label>All aboard <input type="time" id="allAboard" step="300"></label>
  </div>
</section>

<div class="dock" id="dock"></div>

<div class="tabs" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" data-tab="walk" aria-selected="true">Walk</button>
  <button class="tab" role="tab" data-tab="eat" aria-selected="false">Eat</button>
  <button class="tab" role="tab" data-tab="buy" aria-selected="false">Buy</button>
  <button class="tab" role="tab" data-tab="screen" aria-selected="false">Screen</button>
  <button class="tab" role="tab" data-tab="chart" aria-selected="false">Chart</button>
  <button class="tab" role="tab" data-tab="know" aria-selected="false">Know</button>
</div>

<main id="panel"></main>

<footer>
  <span>Adriatic · September 2026</span>
  <button class="reset" id="reset">Clear checkmarks</button>
</footer>

</div>

<script>
/* ============================================================
   DATA — six ports. Hours and prices drift; treat as a guide.
   Every entry carries a coordinate, "lat,lon" in decimal degrees.
   Stops and landmarks are surveyed to the door; shops, kitchens
   and film marks are good to a block, which is all you need on foot.
   ============================================================ */
const PORTS = [
{
  id:"venice", name:"Venice", sub:"Italy · in port 11–14 September · Ai Reali",
  aboard:"19:00", ashore:"09:00",
  dock:{t:"Staying ashore — Ai Reali, Castello",
        d:"Rialto 5 min on foot. Vaporetto: Rialto (Line 1/2) and San Zaccaria for the Giudecca side."},
  stops:[
    {n:"Rialto Market", dur:35, leg:6,
     w:"The Erberia (produce) and Pescaria (fish) have fed the city from this bend in the Grand Canal since the 11th century. Best before 10:00, when it is still a working market rather than a photograph of one.",
     l:"The stone plaques on the Pescaria columns setting minimum legal fish sizes — a medieval fisheries regulation still bolted to the wall.",
     x:"Fish market closed Sunday and Monday. Produce closed Sunday.",
     c:"45.4389,12.3346"},
    {n:"Rialto Bridge", dur:10, leg:14,
     w:"Antonio da Ponte beat Palladio and Michelangelo for the commission in 1588 and built in stone what had collapsed twice in wood.",
     l:"Stand on the Riva del Vin side instead of the bridge itself. The bridge is better seen than stood on.",
     x:"Crossing takes minutes at 08:00 and a quarter hour at midday.",
     c:"45.4380,12.3358"},
    {n:"Piazza San Marco & the Basilica", dur:70, leg:10,
     w:"A Byzantine church in a Gothic square, plated in loot. The mosaics run to roughly four thousand square metres of gold ground.",
     l:"The Pala d'Oro behind the high altar, and the four bronze horses upstairs in the museum — the ones outside are copies.",
     x:"Book the basilica slot online; the walk-up line is the longest in Italy. Shoulders and knees covered. Large bags refused.",
     c:"45.4345,12.3397"},
    {n:"Doge's Palace", dur:80, leg:22,
     w:"Government, courts and prison in one building — which is exactly the point the architecture is making.",
     l:"The Bocca di Leone letterboxes for anonymous denunciations, and the tiny cell doors past the Bridge of Sighs.",
     x:"Secret Itineraries tour is worth the premium and must be booked ahead.",
     c:"45.4337,12.3401"},
    {n:"Santa Maria Gloriosa dei Frari", dur:40, leg:8,
     w:"A vast brick Franciscan barn holding Titian's Assumption above the altar — painted for this exact light, in this exact frame.",
     l:"Titian's own tomb, and Monteverdi's, both in the same church.",
     x:"Closed to visitors during Sunday morning mass. Small admission.",
     c:"45.4370,12.3266"},
    {n:"Scuola Grande di San Rocco", dur:45, leg:16,
     w:"Tintoretto spent twenty-three years covering the ceilings and walls. It is the closest thing Venice has to a Sistine Chapel and it is usually half empty.",
     l:"Take one of the mirrors by the door and walk the upper hall looking down — your neck will thank you.",
     x:"Admission around €10.",
     c:"45.4368,12.3260"},
    {n:"Zattere at golden hour", dur:45, leg:0,
     w:"The southern quay faces Giudecca across open water — the one place in Venice with a horizon and a breeze.",
     l:"Palladio's Redentore directly opposite, best lit in the last hour before sunset.",
     x:"Gelato at Nico, on the quay, since 1935.",
     c:"45.4297,12.3245"}
  ],
  eat:[
    {n:"All'Arco", t:"Cicchetti", d:"Behind the Rialto market. Standing room, whatever the market had that morning. Closes mid-afternoon and does not do dinner.", c:"45.4382,12.3331"},
    {n:"Osteria alla Vedova", t:"Cicchetti", d:"Cannaregio. The meatballs are the reason people come. Cash only, no reservations for the bar.", c:"45.4405,12.3336"},
    {n:"Cantina Do Mori", t:"Bacaro", d:"Operating since 1462. Dark, narrow, hung with copper. Order francobolli and an ombra.", c:"45.4381,12.3335"},
    {n:"Trattoria alla Madonna", t:"Sit-down", d:"Old-guard Venetian fish near Rialto. Unfashionable in the best sense.", c:"45.4378,12.3345"},
    {n:"Pasticceria Tonolo", t:"Breakfast", d:"Dorsoduro. Stand at the bar, take a krapfen, do not ask for a cappuccino after eleven.", c:"45.4362,12.3235"}
  ],
  buy:[
    {n:"Marbled paper", d:"Legatoria Polliero by the Frari, and Il Pavone in Dorsoduro. Hand-combed, not printed — check the edge of the sheet.", c:"45.4369,12.3264"},
    {n:"Murano glass", d:"Buy on Murano itself or from a shop showing the Vetro Artistico Murano trademark. Everything on the Riva degli Schiavoni is imported.", c:"45.4575,12.3530"},
    {n:"Forcole and oars", d:"Saverio Pastor, near the Salute. Sculptural walnut oarlocks — a genuine Venetian craft with about three practitioners left.", c:"45.4300,12.3330"},
    {n:"Burano lace", d:"Real punto in aria costs hundreds and takes months. Anything cheap is machine-made from abroad; the museum shop is honest about which is which.", c:"45.4853,12.4170"}
  ],
  screen:[
    {n:"Campo San Barnaba", f:"Indiana Jones and the Last Crusade", y:"1989", r:"The library",
     d:"The church of San Barnaba is the library Indy walks into looking for the X on the floor. It is deconsecrated and has spent years as an exhibition hall, so the interior you see on screen is not what is behind the door.",
     x:"Two minutes from Tonolo. The same campo is where Katharine Hepburn steps backwards into the canal in Summertime (1955) — the fondamenta by the Ponte dei Pugni.",
     c:"45.4334,12.3261"},
    {n:"Piazza San Marco", f:"Moonraker · Spider-Man: Far From Home", y:"1979 · 2019", r:"The set piece",
     d:"Roger Moore drives a gondola-hovercraft across the paving in Moonraker, to the visible disgust of a pigeon. Forty years later the square and the Rialto are drowned by a water elemental in Far From Home.",
     x:"",
     c:"45.4341,12.3388"},
    {n:"Grand Canal & Rialto Bridge", f:"Casino Royale", y:"2006", r:"Bond's arrival",
     d:"Bond and Vesper sail in past the Doge's Palace and up the Grand Canal — the last quiet ten minutes of the film before the house comes down.",
     x:"The sinking palazzo was a Pinewood tank set. The water is real, the building is not.",
     c:"45.4380,12.3358"},
    {n:"Campo San Polo", f:"Casino Royale", y:"2006", r:"The foot chase",
     d:"The pursuit that ends in the collapsing house runs through the largest campo in Venice after San Marco. It is usually close to empty, which is exactly why it filmed well.",
     x:"",
     c:"45.4374,12.3282"},
    {n:"San Nicolò dei Mendicoli", f:"Don't Look Now", y:"1973", r:"The church John Baxter restores",
     d:"Nicolas Roeg shot the wrong Venice on purpose — winter, empty, far west in Dorsoduro where no tour goes. The church is real, still parish, and still open.",
     x:"Twelve minutes west along the Zattere. The Baxters' hotel is the Gabrielli on Riva degli Schiavoni.",
     c:"45.4326,12.3178"},
    {n:"Palazzo Pisani Moretta", f:"The Tourist", y:"2010", r:"The 'Hotel Danieli' water entrance",
     d:"Depp and Jolie check into the Danieli, except the arrival filmed is this palazzo on the Grand Canal. The actual Danieli is round at San Zaccaria, nowhere near the shot.",
     x:"Best seen from the water — Line 1 passes the door.",
     c:"45.4364,12.3300"}
  ],
  know:[
    "Vaporetto tickets must be validated at the pylon before boarding; the fine for an unvalidated ticket is steep and enforced.",
    "Acqua alta is possible in September. The city posts raised walkway routes and sirens sound a few hours ahead.",
    "Sitting down anywhere on Piazza San Marco with a drink costs several times the standing price, plus the orchestra surcharge.",
    "Tap water from the public fountains is potable and cold. Carry a bottle.",
    "Restaurants add coperto per person — it is a cover charge, not a tip, and it is legal."
  ]
},
{
  id:"dubrovnik", name:"Dubrovnik", sub:"Croatia · Gruž cruise terminal",
  aboard:"17:30", ashore:"08:00",
  dock:{t:"Gruž terminal — about 3 km from the Old Town",
        d:"Bus 1A/1B or taxi to Pile Gate, 10–15 min. Walking it takes 40 min along a road with no shade. Take the bus in, consider walking back along the harbour."},
  stops:[
    {n:"City Walls circuit", dur:105, leg:5,
     w:"Two kilometres of unbroken rampart, up to six metres thick on the landward side. The single best thing in the city and the reason to be at Pile Gate the moment it opens.",
     l:"The moment the sea appears on the Bokar bastion side, and the rooftops — the brighter orange tiles mark what was rebuilt after 1991.",
     x:"Do this FIRST, before 09:00. One-way circuit, no shade, and it becomes brutal by eleven. Entry is not cheap and cash lines are slower than card.",
     c:"42.6414,18.1075"},
    {n:"Onofrio's Fountain & Pile Gate", dur:10, leg:3,
     w:"The 1438 terminus of an aqueduct running twelve kilometres from Šumet — the reason a walled city on limestone could survive a siege.",
     l:"Sixteen carved spouts, each a different face. The water is drinkable; fill your bottle here.",
     x:"",
     c:"42.6414,18.1069"},
    {n:"Franciscan Monastery pharmacy", dur:25, leg:8,
     w:"Dispensing since 1317, which makes it one of the oldest continuously operating pharmacies in Europe. The cloister behind it is the quietest place inside the walls.",

     x:"Small admission for the cloister and museum.",
     c:"42.6417,18.1083"},
    {n:"Stradun", dur:20, leg:4,
     w:"The main street is a filled-in channel that once separated the Roman island of Ragusa from the Slavic mainland settlement. The uniform baroque frontage is post-earthquake rebuild code from 1667.",
     l:"The identical doorways — shop and residence combined in one arched opening, mandated after the quake.",
     x:"Limestone polished by five centuries of feet. It is genuinely slippery in rain.",
     c:"42.6412,18.1097"},
    {n:"Rector's Palace & Sponza", dur:40, leg:5,

     x:"Combined museum ticket covers several sites.",
     c:"42.6406,18.1108"},
    {n:"Jesuit Stairs & St Ignatius", dur:20, leg:12,

     x:"",
     c:"42.6397,18.1097"},

/* ============================================================
   STATE — localStorage where available, memory otherwise.
   ============================================================ */
const mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v===null?mem[k]:v; }catch(e){ return mem[k]; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ delete mem[k]; try{ localStorage.removeItem(k); }catch(e){} }
};

let cur = store.get("sb.port") || PORTS[0].id;
let tab = "walk";
const port = () => PORTS.find(p => p.id === cur);
const doneKey = id => "sb.done." + id;
const getDone = () => { try{ return JSON.parse(store.get(doneKey(cur)) || "[]"); }catch(e){ return []; } };
const setDone = a => store.set(doneKey(cur), JSON.stringify(a));
const timeKey = (id,which) => "sb." + which + "." + id;

/* chart state */
const KIND = {
  walk:   {t:"Stops",  col:"#131E28"},
  eat:    {t:"Eat",    col:"#8C2F39"},
  buy:    {t:"Buy",    col:"#1D5A6E"},
  screen: {t:"Screen", col:"#8A6B1F"}
};
const layers = {walk:true, eat:true, buy:true, screen:true};
let fitAll = false;
let sel = null;                 /* "walk:3" */
const TOWN_KM = 1.5;            /* anything further is plotted off-chart */

/* ============================================================
   HELPERS
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm = m => { const h = Math.floor(m/60), r = Math.round(m%60);
  return h ? h + "h " + String(r).padStart(2,"0") + "m" : r + "m"; };

function minsToday(t){ if(!t) return null; const [h,m] = t.split(":").map(Number); return h*60+m; }
function nowMins(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function clockFromMins(m){ m = ((m % 1440) + 1440) % 1440;
  return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); }

/* --- geography --------------------------------------------- */
const RAD = Math.PI/180;
function ll(c){
  if(!c) return null;
  const p = String(c).split(",").map(Number);
  return (p.length===2 && isFinite(p[0]) && isFinite(p[1])) ? {lat:p[0], lon:p[1]} : null;
}
function kmBetween(a,b){
  const dLat=(b.lat-a.lat)*RAD, dLon=(b.lon-a.lon)*RAD;
  const s = Math.sin(dLat/2)**2 +
            Math.cos(a.lat*RAD)*Math.cos(b.lat*RAD)*Math.sin(dLon/2)**2;
  return 2*6371*Math.asin(Math.min(1,Math.sqrt(s)));
}
const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
function compass(a,b){
  const y = Math.sin((b.lon-a.lon)*RAD)*Math.cos(b.lat*RAD);
  const x = Math.cos(a.lat*RAD)*Math.sin(b.lat*RAD) -
            Math.sin(a.lat*RAD)*Math.cos(b.lat*RAD)*Math.cos((b.lon-a.lon)*RAD);
  const deg = (Math.atan2(y,x)/RAD + 360) % 360;
  return COMPASS[Math.round(deg/22.5) % 16];
}
const dist = km => km < 1 ? Math.round(km*1000) + " m" : km.toFixed(km<10?1:0) + " km";

/* --- the one list everything else reads --------------------- */
function points(p){
  const out = [];
  p.stops.forEach((s,i) => out.push(
    {k:"walk", i, num:i+1, n:s.n, c:s.c, sub:s.dur+" min", d:s.w, x:s.x}));
  (p.eat||[]).forEach((s,i) => out.push(
    {k:"eat", i, num:i+1, n:s.n, c:s.c, sub:"", tag:s.t, d:s.d}));
  (p.buy||[]).forEach((s,i) => out.push(
    {k:"buy", i, num:i+1, n:s.n, c:s.c, sub:"", d:s.d}));
  (p.screen||[]).forEach((s,i) => out.push(
    {k:"screen", i, num:i+1, n:s.n, c:s.c, sub:s.f + " · " + s.y, tag:s.r, d:s.d, x:s.x}));
  return out;
}
const keyOf = o => o.k + ":" + o.i;
const plotted = p => points(p).filter(o => ll(o.c));
function townCentre(p){
  const pts = p.stops.map(s => ll(s.c)).filter(Boolean);
  if(!pts.length) return {lat:0, lon:0};
  return {lat: pts.reduce((a,b)=>a+b.lat,0)/pts.length,
          lon: pts.reduce((a,b)=>a+b.lon,0)/pts.length};
}
const mapsHref = (c,n) => "https://maps.apple.com/?ll=" + c + "&q=" + encodeURIComponent(n);

/* ============================================================
   RENDER — head, ports, tide
   ============================================================ */
function renderPortRail(){
  $("#portRail").innerHTML = PORTS.map(p =>
    '<button class="port-btn" role="tab" data-port="' + p.id + '" aria-selected="' +
    (p.id===cur) + '">' + esc(p.name) + '</button>').join("");
}

function renderHead(){
  const p = port();
  $("#portName").textContent = p.name;
  $("#portSub").textContent = p.sub;
  $("#dock").innerHTML = "<b>" + esc(p.dock.t) + "</b><span>" + esc(p.dock.d) + "</span>";
  $("#ashore").value = store.get(timeKey(cur,"ashore")) || p.ashore;
  $("#allAboard").value = store.get(timeKey(cur,"aboard")) || p.aboard;
}

function renderTide(){
  const a = minsToday($("#ashore").value), b = minsToday($("#allAboard").value);
  const n = nowMins(), clock = $("#tideClock"), fill = $("#tideFill");
  if(a===null || b===null || b<=a){ clock.textContent = "—"; fill.style.width = "0%"; return; }
  const left = b - n;
  const onShoreDay = n >= a && n <= b;
  if(onShoreDay){
    clock.textContent = hhmm(left);
    clock.classList.toggle("warn", left <= 60);
    fill.style.width = Math.min(100, Math.max(0, ((n-a)/(b-a))*100)) + "%";
  } else {
    clock.textContent = hhmm(b-a);
    clock.classList.remove("warn");
    fill.style.width = "0%";
  }
}

/* ============================================================
   RENDER — walk
   ============================================================ */
function renderWalk(){
  const p = port(), done = getDone();
  let out = "";

  // projection from first unchecked stop
  const first = p.stops.findIndex((s,i) => !done.includes(i));
  const b = minsToday($("#allAboard").value);
  if(first > -1 && b !== null){
    let need = 0;
    for(let i=first;i<p.stops.length;i++){ if(done.includes(i)) continue;
      need += p.stops[i].dur + (i < p.stops.length-1 ? p.stops[i].leg : 0); }
    const finish = nowMins() + need;
    const slack = b - finish;
    out += '<div class="proj' + (slack < 30 ? " tight" : "") + '"><b>If you start now</b>' +
      'Remaining stops need <strong>' + hhmm(need) + '</strong> — finishing around <strong>' +
      clockFromMins(finish) + '</strong>. ' +
      (slack >= 0
        ? 'That leaves ' + hhmm(slack) + ' before all aboard.'
        : '<strong>That is ' + hhmm(-slack) + ' past all aboard. Cut something.</strong>') +
      '</div>';
  }

  out += '<ol class="rail">' + p.stops.map((s,i) => {
    const isDone = done.includes(i);
    return '<li class="stop' + (isDone?" done":"") + '" data-i="' + i + '">' +
      '<button class="dot" data-check="' + i + '" aria-label="Mark ' + esc(s.n) + ' done">' +
        (isDone ? "&#10003;" : (i+1)) + '</button>' +
      '<div class="stop-head" data-open="' + i + '">' +
        '<span class="stop-name">' + esc(s.n) + '</span>' +
        '<span class="stop-dur">' + s.dur + ' min</span>' +
      '</div>' +
      '<div class="stop-body">' +
        '<p>' + esc(s.w) + '</p>' +
        (s.l ? '<div class="look"><b>Look for</b>' + esc(s.l) + '</div>' : '') +
        (s.x ? '<p style="margin-top:8px;color:var(--mute);font-size:13.5px">' + esc(s.x) + '</p>' : '') +
        '<a class="geo" href="' + mapsHref(s.c, s.n) + '">' + s.c + ' · Maps</a>' +
        '<button class="geo btn" data-goto="walk:' + i + '">On chart</button>' +
        (i < p.stops.length-1 ? '<div class="leg">&darr; ' + s.leg + ' min walk to ' +
          esc(p.stops[i+1].n) + '</div>' : '') +
      '</div></li>';
  }).join("") + '</ol>';

  return out;
}

/* ============================================================
   RENDER — cards

function glyph(k, num){
  return '<span class="gly k-' + k + '" aria-hidden="true"><i>' + num + '</i></span>';
}

function card(o){
  const k = keyOf(o), L = ll(o.c);
  return '<article class="card' + (sel===k ? " hi" : "") + '" id="card-' + k + '">' +
    '<div class="card-head">' + glyph(o.k, o.num) +
      '<div class="card-title"><span class="card-name">' + esc(o.n) + '</span>' +
        (o.sub ? '<span class="card-meta">' + esc(o.sub) + '</span>' : '') +
        (o.tag ? '<span class="entry-tag">' + esc(o.tag) + '</span>' : '') + '</div>' +
    '</div>' +
    '<p>' + esc(o.d) + '</p>' +
    (o.x ? '<p class="note">' + esc(o.x) + '</p>' : '') +
    '<div class="card-foot">' +
      (L ? '<span class="coord">' + esc(o.c) + '</span>' +
           '<a href="' + mapsHref(o.c, o.n) + '">Open in Maps</a>' +
           '<button data-goto="' + k + '">Show on chart</button>'
         : '<span class="coord">No pin — nothing was filmed here</span>') +
    '</div></article>';
}

function renderCards(kind, note){
  const list = points(port()).filter(o => o.k === kind);
  if(!list.length) return '<p class="sec-note">Nothing listed for this port.</p>';
  return (note ? '<p class="sec-note">' + note + '</p>' : '') +
         list.map(card).join("");
}

/* ============================================================
   RENDER — chart (inline SVG, no tiles, no network)
   ============================================================ */
const VB = {w:380, l:24, r:12, t:12, b:24};   /* height is set per chart, from the ground */
const GRID_STEPS = [0.5,0.2,0.1,0.05,0.02,0.01,0.005,0.002,0.001,0.0005];
const BAR_STEPS  = [10,20,50,100,200,500,1000,2000,5000,10000,20000,50000];

function niceStep(span){
  for(const s of GRID_STEPS){ const n = span/s; if(n >= 2 && n <= 6) return s; }
  return GRID_STEPS[GRID_STEPS.length-1];
}

function buildChart(){
  const p = port();
  const centre = townCentre(p);
  const all = plotted(p).map(o => Object.assign({}, o, {ll: ll(o.c)}));
  const near = all.filter(o => kmBetween(centre, o.ll) <= TOWN_KM);
  const far  = all.filter(o => kmBetween(centre, o.ll) >  TOWN_KM);
  const pool = fitAll ? all : near;
  const shown = pool.filter(o => layers[o.k]);

  /* --- toolbar ------------------------------------------------ */
  let html = '<div class="tools">' +
    Object.keys(KIND).map(k => {
      const n = all.filter(o => o.k===k).length;
      return '<button class="lay" data-layer="' + k + '" aria-pressed="' + !!layers[k] + '">' +
        '<span class="sw k-' + k + '"></span>' + esc(KIND[k].t) + ' ' + n + '</button>';
    }).join("") +
    '<button class="lay" data-fit="1" aria-pressed="' + fitAll + '">' +
      (fitAll ? "Whole coast" : "Town only") + '</button>' +
    '<button class="lay" data-gpx="1">Download .gpx</button>' +
  '</div>';

  if(!shown.length){
    return html + '<div class="chart-frame"><div class="chart-empty">' +
      'Nothing to plot — switch a layer back on.</div></div>' + offList(far, centre);
  }

  /* --- projection: equirectangular, north up ------------------ */
  const kx = Math.cos(centre.lat * RAD);
  const px = o => o.ll.lon * kx, py = o => -o.ll.lat;
  let x0 = Math.min(...shown.map(px)), x1 = Math.max(...shown.map(px));
  let y0 = Math.min(...shown.map(py)), y1 = Math.max(...shown.map(py));
  const MINSPAN = 0.0035;                       /* ~390 m — stops absurd zoom */
  if(x1-x0 < MINSPAN*kx){ const m=(x0+x1)/2, h=MINSPAN*kx/2; x0=m-h; x1=m+h; }
  if(y1-y0 < MINSPAN){ const m=(y0+y1)/2, h=MINSPAN/2; y0=m-h; y1=m+h; }
  const padX = (x1-x0)*0.10, padY = (y1-y0)*0.10;
  x0-=padX; x1+=padX; y0-=padY; y1+=padY;

  /* the frame takes the shape of the ground, within reason — no dead paper */
  const iw = VB.w - VB.l - VB.r;
  const ih = Math.round(Math.min(Math.max(iw*((y1-y0)/(x1-x0)), iw*0.62), iw*1.30));
  const H  = ih + VB.t + VB.b;
  const scale = Math.min(iw/(x1-x0), ih/(y1-y0));
  const cx = (x0+x1)/2, cy = (y0+y1)/2;
  const SX = v => VB.l + iw/2 + (v - cx)*scale;
  const SY = v => VB.t + ih/2 + (v - cy)*scale;

  /* --- graticule ---------------------------------------------- */
  const latStep = niceStep((y1-y0)), lonStep = niceStep((x1-x0)/kx);
  const dec = s => Math.max(0, Math.ceil(-Math.log10(s)));
  let grid = "", ticks = "";
  const latLo = Math.ceil(-y1/latStep)*latStep, latHi = -y0;
  for(let v=latLo; v<=latHi+1e-9; v+=latStep){
    const Y = SY(-v);
    grid += '<line x1="' + VB.l + '" y1="' + Y.toFixed(1) + '" x2="' + (VB.w-VB.r) +
            '" y2="' + Y.toFixed(1) + '"/>';
    ticks += '<text x="' + (VB.l-3) + '" y="' + (Y+3).toFixed(1) +
             '" text-anchor="end" class="tk">' + v.toFixed(dec(latStep)) + '</text>';
  }
  const lonLo = Math.ceil((x0/kx)/lonStep)*lonStep, lonHi = x1/kx;
  for(let v=lonLo; v<=lonHi+1e-9; v+=lonStep){
    const X = SX(v*kx);
    grid += '<line x1="' + X.toFixed(1) + '" y1="' + VB.t + '" x2="' + X.toFixed(1) +
            '" y2="' + (H-VB.b) + '"/>';
    ticks += '<text x="' + X.toFixed(1) + '" y="' + (H-VB.b+11) +
             '" text-anchor="middle" class="tk">' + v.toFixed(dec(lonStep)) + '</text>';
  }

  /* --- walk route --------------------------------------------- */
  let route = "";
  const walk = shown.filter(o => o.k==="walk").sort((a,b)=>a.i-b.i);
  if(walk.length > 1){
    route = '<polyline class="route" points="' +
      walk.map(o => SX(px(o)).toFixed(1) + "," + SY(py(o)).toFixed(1)).join(" ") + '"/>';
  }

  /* --- de-collide markers, keeping a leader to the true spot --- */
  const nodes = shown.map(o => {
    const X = SX(px(o)), Y = SY(py(o));
    return {o, x0:X, y0:Y, x:X, y:Y};
  });
  const MIN = 22, CAP = 26;
  for(let it=0; it<90; it++){
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i], b=nodes[j];
        let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
        if(d >= MIN) continue;
        if(d < 0.01){ dx = (i%2?1:-1)*0.6; dy = (j%2?1:-1)*0.6; d = Math.hypot(dx,dy); }
        const push = (MIN-d)/2 * 0.45 / d;
        a.x -= dx*push; a.y -= dy*push; b.x += dx*push; b.y += dy*push;
      }
    }
    nodes.forEach(n => { n.x += (n.x0-n.x)*0.03; n.y += (n.y0-n.y)*0.03; });
  }
  nodes.forEach(n => {
    let dx=n.x-n.x0, dy=n.y-n.y0, d=Math.hypot(dx,dy);
    if(d > CAP){ n.x = n.x0 + dx/d*CAP; n.y = n.y0 + dy/d*CAP; }
    n.x = Math.max(VB.l+11, Math.min(VB.w-VB.r-11, n.x));
    n.y = Math.max(VB.t+11, Math.min(H-VB.b-11, n.y));
  });

  let leaders = "", pins = "";
  nodes.forEach(n => {
    const k = keyOf(n.o), isSel = sel === k, col = KIND[n.o.k].col;
    if(Math.hypot(n.x-n.x0, n.y-n.y0) > 4){
      leaders += '<line class="lead" x1="' + n.x0.toFixed(1) + '" y1="' + n.y0.toFixed(1) +
                 '" x2="' + n.x.toFixed(1) + '" y2="' + n.y.toFixed(1) + '"/>' +
                 '<circle class="true" cx="' + n.x0.toFixed(1) + '" cy="' + n.y0.toFixed(1) + '" r="1.4"/>';
    }
    let shape;
    if(n.o.k === "walk")      shape = '<circle r="9.6" fill="' + col + '"/>';
    else if(n.o.k === "eat")  shape = '<rect x="-8.4" y="-8.4" width="16.8" height="16.8" fill="' + col + '"/>';
    else if(n.o.k === "buy")  shape = '<rect x="-8" y="-8" width="16" height="16" transform="rotate(45)" fill="' + col + '"/>';
    else                      shape = '<circle r="9.8" fill="' + col + '"/>' +
                                      '<circle r="7.2" fill="none" stroke="#FBFAF6" stroke-width="1"/>';
    pins += '<g class="pin" data-pin="' + k + '" transform="translate(' + n.x.toFixed(1) + ',' +
              n.y.toFixed(1) + ')" role="button" tabindex="0" aria-label="' + esc(n.o.n) + '">' +
              (isSel ? '<circle class="halo" r="15"/>' : '') + shape +
              '<text y="3.3" text-anchor="middle">' + n.o.num + '</text></g>';
  });

  /* --- scale bar and north arrow ------------------------------ */
  const mPerUnit = 110574/scale;
  let barM = BAR_STEPS[0];
  for(const s of BAR_STEPS){ barM = s; if(s/mPerUnit >= 45) break; }
  const barLen = barM/mPerUnit;
  const bx = VB.l + 4, by = H - VB.b - 8;
  const bar = '<g class="bar"><line x1="' + bx + '" y1="' + by + '" x2="' + (bx+barLen).toFixed(1) +
    '" y2="' + by + '"/><line x1="' + bx + '" y1="' + (by-3) + '" x2="' + bx + '" y2="' + (by+3) + '"/>' +
    '<line x1="' + (bx+barLen).toFixed(1) + '" y1="' + (by-3) + '" x2="' + (bx+barLen).toFixed(1) +
    '" y2="' + (by+3) + '"/><text x="' + (bx+barLen/2).toFixed(1) + '" y="' + (by-6) +
    '" text-anchor="middle" class="tk">' + (barM<1000 ? barM+" m" : (barM/1000)+" km") + '</text></g>';
  const nx = VB.w - VB.r - 12, ny = VB.t + 10;
  const north = '<g class="rose"><line x1="' + nx + '" y1="' + (ny+16) + '" x2="' + nx + '" y2="' + ny +
    '"/><polygon points="' + nx + ',' + (ny-4) + ' ' + (nx-3.2) + ',' + (ny+2) + ' ' +
    (nx+3.2) + ',' + (ny+2) + '"/><text x="' + nx + '" y="' + (ny+26) +
    '" text-anchor="middle" class="tk">N</text></g>';

  html += '<div class="chart-frame"><svg viewBox="0 0 ' + VB.w + ' ' + H +
    '" role="img" aria-label="Chart of ' + esc(p.name) + '">' +
    '<g class="gr">' + grid + '</g>' +
    '<rect class="frm" x="' + VB.l + '" y="' + VB.t + '" width="' + iw + '" height="' + ih + '"/>' +
    ticks + route + leaders + bar + north + pins +
  '</svg></div>';

  /* --- selected detail ---------------------------------------- */
  const chosen = shown.find(o => keyOf(o) === sel);
  if(chosen) html += card(chosen);

  /* --- index and off-chart ------------------------------------ */
  html += '<div class="index"><h3>Index</h3>' + shown.map(o => {
    const k = keyOf(o);
    return '<button class="ixrow" data-pin="' + k + '" aria-current="' + (sel===k) + '">' +
      glyph(o.k, o.num) + '<span class="ixname">' + esc(o.n) + '</span>' +
      '<span class="ixsub">' + esc(KIND[o.k].t) + '</span></button>';
  }).join("") +
  '<p class="sec-note" style="margin-top:12px">Decimal degrees, WGS 84 — the same numbers your ' +
  'phone reads. Stops and landmarks are surveyed to the door; kitchens, shops and film marks are ' +
  'good to a block, which is all you need on foot. Where two pins would collide the marker is ' +
  'nudged clear and a hairline points back to the true position.</p></div>';

  html += offList(far, centre);
  return html;
}

function offList(far, centre){
  if(fitAll || !far.length) return "";
  const rows = far.filter(o => layers[o.k]).sort((a,b) =>
    kmBetween(centre,a.ll) - kmBetween(centre,b.ll));
  if(!rows.length) return "";
  return '<div class="off"><h3>Off the chart</h3>' + rows.map(o =>
    '<div class="offrow">' + glyph(o.k, o.num) +
      '<span class="oname">' + esc(o.n) +
        '<span class="osub">' + esc(o.sub || "") + '</span></span>' +
      '<span class="bearing">' + compass(centre, o.ll) + ' ' + dist(kmBetween(centre, o.ll)) + '</span>' +
    '</div>').join("") +
    '<p class="sec-note" style="margin-top:10px">Bearings and distances are from the middle of the ' +
    'old town. Switch the chart to <strong>whole coast</strong> to plot them.</p></div>';
}

/* ============================================================
   GPX — hand the whole port to any map app, offline
   ============================================================ */
function gpxFor(p){
  const x = s => String(s==null?"":s).replace(/[&<>'"]/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&apos;",'"':"&quot;"}[c]));
  const wpts = plotted(p).map(o => {
    const L = ll(o.c);
    return '  <wpt lat="' + L.lat + '" lon="' + L.lon + '">\n' +
      '    <name>' + x(KIND[o.k].t.toUpperCase().slice(0,1) + o.num + " " + o.n) + '</name>\n' +
      '    <desc>' + x((o.sub ? o.sub + " — " : "") + (o.d||"")) + '</desc>\n' +
      '    <type>' + o.k + '</type>\n  </wpt>';
  }).join("\n");
  const rte = '  <rte>\n    <name>' + x(p.name + " — walking order") + '</name>\n' +
    p.stops.filter(s => ll(s.c)).map(s => { const L = ll(s.c);
      return '    <rtept lat="' + L.lat + '" lon="' + L.lon + '"><name>' + x(s.n) + '</name></rtept>';
    }).join("\n") + '\n  </rte>';
  return '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<gpx version="1.1" creator="Shore Book · Adriatic 2026" ' +
    'xmlns="http://www.topografix.com/GPX/1/1">\n' +
    '  <metadata><name>' + x("Shore Book — " + p.name) + '</name></metadata>\n' +
    wpts + '\n' + rte + '\n</gpx>\n';
}

function download(name, text, mime){
  try{
    const url = URL.createObjectURL(new Blob([text], {type:mime}));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }catch(e){
    window.open("data:" + mime + ";charset=utf-8," + encodeURIComponent(text), "_blank");
  }
}

/* ============================================================
   RENDER — panel
   ============================================================ */
function renderPanel(){
  const p = port();
  if(tab === "walk")        $("#panel").innerHTML = renderWalk();
  else if(tab === "eat")    $("#panel").innerHTML = renderCards("eat");
  else if(tab === "buy")    $("#panel").innerHTML = renderCards("buy");
  else if(tab === "screen") $("#panel").innerHTML = renderCards("screen",
    "What was filmed here, and what only pretends to have been. Everything below is a real location you can stand on unless the card says otherwise.");
  else if(tab === "chart")  $("#panel").innerHTML = buildChart();
  else $("#panel").innerHTML = '<ul class="know">' +
    p.know.map(k => "<li>" + esc(k) + "</li>").join("") + "</ul>";
}

function renderAll(){
  renderPortRail(); renderHead(); renderTide(); renderPanel();
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", t.dataset.tab === tab));
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", e => {
  const pb = e.target.closest("[data-port]");
  if(pb){ cur = pb.dataset.port; sel = null; store.set("sb.port", cur);
    renderAll(); window.scrollTo(0,0); return; }

  const tb = e.target.closest(".tab");
  if(tb){ tab = tb.dataset.tab; renderAll(); return; }

  const lay = e.target.closest("[data-layer]");
  if(lay){ const k = lay.dataset.layer; layers[k] = !layers[k];
    if(sel && sel.split(":")[0] === k && !layers[k]) sel = null;
    renderPanel(); return; }

  const fit = e.target.closest("[data-fit]");
  if(fit){ fitAll = !fitAll; renderPanel(); return; }

  const gp = e.target.closest("[data-gpx]");
  if(gp){ const p = port();
    download("shore-book-" + p.id + ".gpx", gpxFor(p), "application/gpx+xml"); return; }

  const pin = e.target.closest("[data-pin]");
  if(pin){ const k = pin.dataset.pin; sel = (sel === k) ? null : k; renderPanel();
    const c = sel && $("#card-" + CSS.escape(sel));
    if(c) c.scrollIntoView({block:"nearest", behavior:"smooth"});
    return; }

  const go = e.target.closest("[data-goto]");
  if(go){ sel = go.dataset.goto; tab = "chart"; renderAll();
    window.scrollTo({top:0, behavior:"smooth"}); return; }

  const chk = e.target.closest("[data-check]");
  if(chk){
    const i = +chk.dataset.check, d = getDone();
    const k = d.indexOf(i); k > -1 ? d.splice(k,1) : d.push(i);
    setDone(d); renderPanel(); return;
  }

  const op = e.target.closest("[data-open]");
  if(op){ op.parentElement.classList.toggle("open"); return; }
});

/* pins are SVG groups — give them a keyboard */
document.addEventListener("keydown", e => {
  if(e.key !== "Enter" && e.key !== " ") return;
  const pin = e.target.closest && e.target.closest("g[data-pin]");
  if(!pin) return;
  e.preventDefault();
  const k = pin.dataset.pin; sel = (sel === k) ? null : k; renderPanel();
});

$("#ashore").addEventListener("change", e => {
  store.set(timeKey(cur,"ashore"), e.target.value); renderTide(); renderPanel(); });
$("#allAboard").addEventListener("change", e => {
  store.set(timeKey(cur,"aboard"), e.target.value); renderTide(); renderPanel(); });
$("#reset").addEventListener("click", () => { setDone([]); renderPanel(); });

const d = new Date();
$("#today").textContent = d.toLocaleDateString("en-GB",
  {weekday:"short", day:"numeric", month:"short"});

renderAll();
setInterval(() => { renderTide(); if(tab==="walk") renderPanel(); }, 60000);

/* Offline: cache the app on first load so it runs with no signal. */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
