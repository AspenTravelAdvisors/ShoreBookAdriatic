<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shore Book">
<meta name="theme-color" content="#EDEAE1">
<title>Shore Book · Adriatic 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --stone:#EDEAE1;
  --sand:#FBFAF6;
  --ink:#131E28;
  --sea:#1D5A6E;
  --sea-tint:#DDE7E9;
  --rosso:#8C2F39;
  --rule:#C9C6BB;
  --mute:#6E7378;
  --display:"Didot","Bodoni 72",Didot LT STD,"Hoefler Text",Georgia,serif;
  --body:"Avenir Next",Avenir,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Menlo","SF Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--stone);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:620px;margin:0 auto;padding:0 18px 72px}

/* ---------- masthead ---------- */
header{padding:22px 0 0}
.kicker{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mute);display:flex;justify-content:space-between;align-items:baseline;
}
h1{
  font-family:var(--display);font-weight:400;font-size:44px;line-height:.95;
  margin:8px 0 2px;letter-spacing:-.01em;
}
.sub{font-size:13px;color:var(--mute);margin:0 0 14px}

/* ---------- port rail ---------- */
.ports{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;margin:0 -18px;
  padding-left:18px;padding-right:18px;scrollbar-width:none}
.ports::-webkit-scrollbar{display:none}
.port-btn{
  flex:0 0 auto;background:transparent;border:1px solid var(--rule);
  border-radius:2px;padding:7px 12px;font-family:var(--mono);font-size:11px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mute);cursor:pointer;
}
.port-btn[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--stone)}
.port-btn:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

/* ---------- tide bar (signature) ---------- */
.tide{border:1px solid var(--ink);background:var(--sand);padding:12px 13px 11px;margin:2px 0 18px}
.tide-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tide-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.tide-clock{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tide-clock.warn{color:var(--rosso)}
.tide-track{
  position:relative;height:16px;margin:10px 0 8px;border:1px solid var(--rule);
  background:repeating-linear-gradient(-45deg,transparent 0 4px,var(--rule) 4px 5px);
}
.tide-fill{position:absolute;inset:0 auto 0 0;background:var(--sea-tint);
  border-right:2px solid var(--sea);transition:width .6s ease}
@media (prefers-reduced-motion:reduce){.tide-fill{transition:none}}
.tide-foot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mute)}
.tide-foot input{
  font-family:var(--mono);font-size:12px;border:0;border-bottom:1px solid var(--rule);
  background:transparent;color:var(--ink);padding:1px 0;
}
.tide-foot input:focus{outline:none;border-bottom-color:var(--sea)}

/* ---------- dock strip ---------- */
.dock{border-left:3px solid var(--sea);padding:2px 0 2px 12px;margin:0 0 20px;font-size:14px}
.dock b{font-weight:600}
.dock span{display:block;color:var(--mute);font-size:13px;margin-top:2px}

/* ---------- tabs ---------- */
.tabs{display:flex;border-bottom:1px solid var(--rule);margin:0 0 18px}
.tab{
  flex:1;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
  padding:9px 2px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mute);cursor:pointer;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--rosso)}
.tab:focus-visible{outline:2px solid var(--sea);outline-offset:-2px}

/* ---------- sounding rail (stops) ---------- */
.rail{position:relative;margin:0;padding:0 0 0 34px;list-style:none}
.rail::before{content:"";position:absolute;left:9px;top:10px;bottom:26px;
  width:1px;background:var(--rule)}
.stop{position:relative;padding:0 0 20px}
.dot{
  position:absolute;left:-34px;top:2px;width:19px;height:19px;border-radius:50%;
  border:1px solid var(--ink);background:var(--stone);color:var(--ink);
  font-family:var(--mono);font-size:10px;line-height:17px;text-align:center;
  cursor:pointer;padding:0;
}
.stop.done .dot{background:var(--ink);color:var(--stone)}
.stop.done .stop-name{text-decoration:line-through;color:var(--mute)}
.dot:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.stop-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  cursor:pointer}
.stop-name{font-family:var(--display);font-size:21px;line-height:1.15}
.stop-dur{font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap}
.stop-body{display:none;padding:6px 0 0}
.stop.open .stop-body{display:block}
.stop-body p{margin:0 0 8px;font-size:14.5px}
.look{border-left:2px solid var(--rosso);padding-left:10px;font-size:13.5px;color:var(--ink)}
.look b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--rosso);display:block;margin-bottom:2px;font-weight:400}
.leg{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mute);margin-top:10px}
.geo{display:inline-block;margin-top:9px;font-family:var(--mono);font-size:11px;
  color:var(--sea);text-decoration:none;border-bottom:1px solid var(--sea-tint)}

/* ---------- projection ---------- */
.proj{border:1px dashed var(--rule);background:var(--sand);padding:11px 13px;margin:0 0 20px;
  font-size:13.5px}
.proj b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);display:block;margin-bottom:3px;font-weight:400}
.proj.tight{border-color:var(--rosso);border-style:solid}
.proj.tight strong{color:var(--rosso)}

/* ---------- lists ---------- */
.entry{border-top:1px solid var(--rule);padding:12px 0}
.entry:first-child{border-top:0}
.entry-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.entry-name{font-family:var(--display);font-size:19px}
.entry-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--sea);white-space:nowrap;border:1px solid var(--sea-tint);padding:2px 5px}
.entry p{margin:5px 0 0;font-size:14px;color:var(--ink)}
.know li{font-size:14.5px;margin-bottom:9px}
.know{padding-left:18px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--rule);margin-top:26px;padding:14px 0 0;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--mute);
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.reset{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;
  cursor:pointer;padding:0}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="kicker"><span>Shore Book</span><span id="today">—</span></div>
  <h1 id="portName">—</h1>
  <p class="sub" id="portSub">—</p>
</header>

<div class="ports" role="tablist" aria-label="Ports" id="portRail"></div>

<section class="tide" aria-live="polite">
  <div class="tide-top">
    <span class="tide-label">Back on board in</span>
    <span class="tide-clock" id="tideClock">—</span>
  </div>
  <div class="tide-track"><div class="tide-fill" id="tideFill" style="width:0%"></div></div>
  <div class="tide-foot">
    <label>Ashore <input type="time" id="ashore" step="300"></label>
    <label>All aboard <input type="time" id="allAboard" step="300"></label>
  </div>
</section>

<div class="dock" id="dock"></div>

<div class="tabs" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" data-tab="walk" aria-selected="true">Walk</button>
  <button class="tab" role="tab" data-tab="eat" aria-selected="false">Eat</button>
  <button class="tab" role="tab" data-tab="buy" aria-selected="false">Buy</button>
  <button class="tab" role="tab" data-tab="know" aria-selected="false">Know</button>
</div>

<main id="panel"></main>

<footer>
  <span>Adriatic · September 2026</span>
  <button class="reset" id="reset">Clear checkmarks</button>
</footer>

</div>

/* ============================================================
   STATE — localStorage where available, memory otherwise.
   ============================================================ */
const mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v===null?mem[k]:v; }catch(e){ return mem[k]; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ delete mem[k]; try{ localStorage.removeItem(k); }catch(e){} }
};

let cur = store.get("sb.port") || PORTS[0].id;
let tab = "walk";
const port = () => PORTS.find(p => p.id === cur);
const doneKey = id => "sb.done." + id;
const getDone = () => { try{ return JSON.parse(store.get(doneKey(cur)) || "[]"); }catch(e){ return []; } };
const setDone = a => store.set(doneKey(cur), JSON.stringify(a));
const timeKey = (id,which) => "sb." + which + "." + id;

/* ============================================================
   HELPERS
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm = m => { const h = Math.floor(m/60), r = Math.round(m%60);
  return h ? h + "h " + String(r).padStart(2,"0") + "m" : r + "m"; };

function minsToday(t){ if(!t) return null; const [h,m] = t.split(":").map(Number); return h*60+m; }
function nowMins(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function clockFromMins(m){ m = ((m % 1440) + 1440) % 1440;
  return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); }

/* ============================================================
   RENDER
   ============================================================ */
function renderPortRail(){
  $("#portRail").innerHTML = PORTS.map(p =>
    '<button class="port-btn" role="tab" data-port="' + p.id + '" aria-selected="' +
    (p.id===cur) + '">' + esc(p.name) + '</button>').join("");
}

function renderHead(){
  const p = port();
  $("#portName").textContent = p.name;
  $("#portSub").textContent = p.sub;
  $("#dock").innerHTML = "<b>" + esc(p.dock.t) + "</b><span>" + esc(p.dock.d) + "</span>";
  $("#ashore").value = store.get(timeKey(cur,"ashore")) || p.ashore;
  $("#allAboard").value = store.get(timeKey(cur,"aboard")) || p.aboard;
}

function renderTide(){
  const a = minsToday($("#ashore").value), b = minsToday($("#allAboard").value);
  const n = nowMins(), clock = $("#tideClock"), fill = $("#tideFill");
  if(a===null || b===null || b<=a){ clock.textContent = "—"; fill.style.width = "0%"; return; }
  const left = b - n;
  const onShoreDay = n >= a && n <= b;
  if(onShoreDay){
    clock.textContent = hhmm(left);
    clock.classList.toggle("warn", left <= 60);
    fill.style.width = Math.min(100, Math.max(0, ((n-a)/(b-a))*100)) + "%";
  } else {
    clock.textContent = hhmm(b-a);
    clock.classList.remove("warn");
    fill.style.width = "0%";
  }
}

function renderWalk(){
  const p = port(), done = getDone();
  let out = "";

  // projection from first unchecked stop
  const first = p.stops.findIndex((s,i) => !done.includes(i));
  const b = minsToday($("#allAboard").value);
  if(first > -1 && b !== null){
    let need = 0;
    for(let i=first;i<p.stops.length;i++){ if(done.includes(i)) continue;
      need += p.stops[i].dur + (i < p.stops.length-1 ? p.stops[i].leg : 0); }
    const finish = nowMins() + need;
    const slack = b - finish;
    out += '<div class="proj' + (slack < 30 ? " tight" : "") + '"><b>If you start now</b>' +
      'Remaining stops need <strong>' + hhmm(need) + '</strong> — finishing around <strong>' +
      clockFromMins(finish) + '</strong>. ' +
      (slack >= 0
        ? 'That leaves ' + hhmm(slack) + ' before all aboard.'
        : '<strong>That is ' + hhmm(-slack) + ' past all aboard. Cut something.</strong>') +
      '</div>';
  }

  out += '<ol class="rail">' + p.stops.map((s,i) => {
    const isDone = done.includes(i);
    return '<li class="stop' + (isDone?" done":"") + '" data-i="' + i + '">' +
      '<button class="dot" data-check="' + i + '" aria-label="Mark ' + esc(s.n) + ' done">' +
        (isDone ? "&#10003;" : (i+1)) + '</button>' +
      '<div class="stop-head" data-open="' + i + '">' +
        '<span class="stop-name">' + esc(s.n) + '</span>' +
        '<span class="stop-dur">' + s.dur + ' min</span>' +
      '</div>' +
      '<div class="stop-body">' +
        '<p>' + esc(s.w) + '</p>' +
        (s.l ? '<div class="look"><b>Look for</b>' + esc(s.l) + '</div>' : '') +
        (s.x ? '<p style="margin-top:8px;color:var(--mute);font-size:13.5px">' + esc(s.x) + '</p>' : '') +
        '<a class="geo" href="https://maps.apple.com/?ll=' + s.c + '&q=' + encodeURIComponent(s.n) +
          '">' + s.c + ' · open in Maps</a>' +
        (i < p.stops.length-1 ? '<div class="leg">&darr; ' + s.leg + ' min walk to ' +
          esc(p.stops[i+1].n) + '</div>' : '') +
      '</div></li>';
  }).join("") + '</ol>';

  return out;
}

function renderList(items, tagKey){
  return items.map(x =>
    '<div class="entry"><div class="entry-head"><span class="entry-name">' + esc(x.n) + '</span>' +
    (x.t ? '<span class="entry-tag">' + esc(x.t) + '</span>' : '') +
    '</div><p>' + esc(x.d) + '</p></div>').join("");
}

function renderPanel(){
  const p = port();
  if(tab === "walk") $("#panel").innerHTML = renderWalk();
  else if(tab === "eat") $("#panel").innerHTML = renderList(p.eat);
  else if(tab === "buy") $("#panel").innerHTML = renderList(p.buy);
  else $("#panel").innerHTML = '<ul class="know">' +
    p.know.map(k => "<li>" + esc(k) + "</li>").join("") + "</ul>";
}

function renderAll(){
  renderPortRail(); renderHead(); renderTide(); renderPanel();
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", t.dataset.tab === tab));
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", e => {
  const pb = e.target.closest("[data-port]");
  if(pb){ cur = pb.dataset.port; store.set("sb.port", cur); renderAll(); window.scrollTo(0,0); return; }

  const tb = e.target.closest(".tab");
  if(tb){ tab = tb.dataset.tab; renderAll(); return; }

  const chk = e.target.closest("[data-check]");
  if(chk){
    const i = +chk.dataset.check, d = getDone();
    const k = d.indexOf(i); k > -1 ? d.splice(k,1) : d.push(i);
    setDone(d); renderPanel(); return;
  }

  const op = e.target.closest("[data-open]");
  if(op){ op.parentElement.classList.toggle("open"); return; }
});

$("#ashore").addEventListener("change", e => {
  store.set(timeKey(cur,"ashore"), e.target.value); renderTide(); renderPanel(); });
$("#allAboard").addEventListener("change", e => {
  store.set(timeKey(cur,"aboard"), e.target.value); renderTide(); renderPanel(); });
$("#reset").addEventListener("click", () => { setDone([]); renderPanel(); });

const d = new Date();
$("#today").textContent = d.toLocaleDateString("en-GB",
  {weekday:"short", day:"numeric", month:"short"});

renderAll();
setInterval(() => { renderTide(); if(tab==="walk") renderPanel(); }, 60000);

/* Offline: cache the app on first load so it runs with no signal. */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
