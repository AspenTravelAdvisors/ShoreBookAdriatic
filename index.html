<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shore Book">
<meta name="theme-color" content="#EDEAE1">
<title>Shore Book · Adriatic 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --stone:#EDEAE1;
  --sand:#FBFAF6;
  --ink:#131E28;
  --sea:#1D5A6E;
  --sea-tint:#DDE7E9;
  --rosso:#8C2F39;
  --reel:#8A6B1F;
  --olio:#4F6B2F;
  --rule:#C9C6BB;
  --mute:#6E7378;
  --display:"Didot","Bodoni 72",Didot LT STD,"Hoefler Text",Georgia,serif;
  --body:"Avenir Next",Avenir,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Menlo","SF Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--stone);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:620px;margin:0 auto;padding:0 18px 72px}

/* ---------- masthead ---------- */
header{padding:22px 0 0}
.kicker{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mute);display:flex;justify-content:space-between;align-items:baseline;
}
h1{
  font-family:var(--display);font-weight:400;font-size:44px;line-height:.95;
  margin:8px 0 2px;letter-spacing:-.01em;
}
.sub{font-size:13px;color:var(--mute);margin:0 0 14px}

/* ---------- port rail ---------- */
.ports{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;margin:0 -18px;
  padding-left:18px;padding-right:18px;scrollbar-width:none}
.ports::-webkit-scrollbar{display:none}
.port-btn{
  flex:0 0 auto;background:transparent;border:1px solid var(--rule);
  border-radius:2px;padding:7px 12px;font-family:var(--mono);font-size:11px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mute);cursor:pointer;
}
.port-btn[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--stone)}
.port-btn:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

/* ---------- tide bar (signature) ---------- */
.tide{border:1px solid var(--ink);background:var(--sand);padding:12px 13px 11px;margin:2px 0 18px}
.tide-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tide-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.tide-clock{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tide-clock.warn{color:var(--rosso)}
.tide-track{
  position:relative;height:16px;margin:10px 0 8px;border:1px solid var(--rule);
  background:repeating-linear-gradient(-45deg,transparent 0 4px,var(--rule) 4px 5px);
}
.tide-fill{position:absolute;inset:0 auto 0 0;background:var(--sea-tint);
  border-right:2px solid var(--sea);transition:width .6s ease}
@media (prefers-reduced-motion:reduce){.tide-fill{transition:none}}
.tide-foot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mute)}
.tide-foot input{
  font-family:var(--mono);font-size:12px;border:0;border-bottom:1px solid var(--rule);
  background:transparent;color:var(--ink);padding:1px 0;
}
.tide-foot input:focus{outline:none;border-bottom-color:var(--sea)}

/* ---------- dock strip ---------- */
.dock{border-left:3px solid var(--sea);padding:2px 0 2px 12px;margin:0 0 20px;font-size:14px}
.dock b{font-weight:600}
.dock span{display:block;color:var(--mute);font-size:13px;margin-top:2px}

/* ---------- tabs ---------- */
.tabs{display:flex;border-bottom:1px solid var(--rule);margin:0 0 18px}
.tab{
  flex:1 1 0;min-width:0;background:none;border:0;border-bottom:2px solid transparent;
  margin-bottom:-1px;padding:9px 1px;font-family:var(--mono);font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--mute);cursor:pointer;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--rosso)}
.tab:focus-visible{outline:2px solid var(--sea);outline-offset:-2px}

/* ---------- sounding rail (stops) ---------- */
.rail{position:relative;margin:0;padding:0 0 0 34px;list-style:none}
.rail::before{content:"";position:absolute;left:9px;top:10px;bottom:26px;
  width:1px;background:var(--rule)}
.stop{position:relative;padding:0 0 20px}
.dot{
  position:absolute;left:-34px;top:2px;width:19px;height:19px;border-radius:50%;
  border:1px solid var(--ink);background:var(--stone);color:var(--ink);
  font-family:var(--mono);font-size:10px;line-height:17px;text-align:center;
  cursor:pointer;padding:0;
}
.stop.done .dot{background:var(--ink);color:var(--stone)}
.stop.done .stop-name{text-decoration:line-through;color:var(--mute)}
.dot:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.stop-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  cursor:pointer}
.stop-name{font-family:var(--display);font-size:21px;line-height:1.15}
.stop-dur{font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap}
.stop-body{display:none;padding:6px 0 0}
.stop.open .stop-body{display:block}
.stop-body p{margin:0 0 8px;font-size:14.5px}
.look{border-left:2px solid var(--rosso);padding-left:10px;font-size:13.5px;color:var(--ink)}
.look b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--rosso);display:block;margin-bottom:2px;font-weight:400}
.leg{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mute);margin-top:10px}

/* ---------- food tour (a rail, but nothing to tick off) ---------- */
.dot.static{cursor:default;line-height:17px}
.stop.taste .dot{border-color:var(--olio);color:var(--olio)}
.stop-where{display:block;font-family:var(--body);font-size:12.5px;line-height:1.35;
  color:var(--mute);margin-top:3px}
.stop-dur em{display:block;font-style:normal;font-size:10px;text-align:right;margin-top:3px}
.look.ord{border-left-color:var(--olio)}
.look.ord b{color:var(--olio)}
.geo{display:inline-block;margin-top:9px;font-family:var(--mono);font-size:11px;
  color:var(--sea);text-decoration:none;border-bottom:1px solid var(--sea-tint)}
.geo+.geo{margin-left:14px}
.geo.btn{border:0;border-bottom:1px solid var(--sea-tint);background:none;padding:0;cursor:pointer}

/* ---------- projection ---------- */
.proj{border:1px dashed var(--rule);background:var(--sand);padding:11px 13px;margin:0 0 20px;
  font-size:13.5px}
.proj b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);display:block;margin-bottom:3px;font-weight:400}
.proj.tight{border-color:var(--rosso);border-style:solid}
.proj.tight strong{color:var(--rosso)}

/* ---------- lists ---------- */
.entry{border-top:1px solid var(--rule);padding:12px 0}
.entry:first-child{border-top:0}
.entry-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.entry-name{font-family:var(--display);font-size:19px}
.entry-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--sea);white-space:nowrap;border:1px solid var(--sea-tint);padding:2px 5px}
.entry p{margin:5px 0 0;font-size:14px;color:var(--ink)}
.know li{font-size:14.5px;margin-bottom:9px}
.know{padding-left:18px}

/* ---------- glyphs (shared by chart and cards) ---------- */
.gly{
  display:inline-flex;align-items:center;justify-content:center;
  width:21px;height:21px;flex:0 0 21px;margin-top:1px;
  font-family:var(--mono);font-size:10px;color:var(--sand);background:var(--ink);
}
.gly i{font-style:normal;display:block}
.gly.k-walk{border-radius:50%}
.gly.k-eat{background:var(--rosso)}
.gly.k-buy{background:var(--sea);transform:rotate(45deg)}
.gly.k-buy i{transform:rotate(-45deg)}
.gly.k-screen{background:var(--reel);border-radius:50%;
  box-shadow:inset 0 0 0 1px var(--reel), inset 0 0 0 2.4px var(--sand)}
.gly.k-taste{background:var(--olio);clip-path:polygon(50% 0,100% 100%,0 100%)}
.gly.k-taste i{margin-top:6px;font-size:9px}

/* ---------- cards ---------- */
.card{border:1px solid var(--rule);background:var(--sand);padding:11px 12px;margin:0 0 10px}
.card.hi{border-color:var(--ink);box-shadow:2px 2px 0 var(--rule)}
.card-head{display:flex;gap:10px;align-items:flex-start}
.card-title{flex:1;min-width:0}
.card-name{font-family:var(--display);font-size:19px;line-height:1.15;display:block}
.card-meta{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);display:block;margin-top:3px}
.card-title .entry-tag{display:inline-block;margin-top:6px;white-space:normal}
.card p{margin:7px 0 0;font-size:14px}
.card .note{color:var(--mute);font-size:13px}
.card-foot{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;margin-top:10px;
  font-family:var(--mono);font-size:10.5px}
.card-foot a,.card-foot button{color:var(--sea);text-decoration:none;border:0;background:none;
  font:inherit;padding:0;cursor:pointer;border-bottom:1px solid var(--sea-tint)}
.coord{color:var(--mute);font-family:var(--mono);font-size:10.5px}
.sec-note{font-size:12.5px;color:var(--mute);margin:0 0 14px}

/* ---------- chart ---------- */
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.lay{
  border:1px solid var(--rule);background:transparent;cursor:pointer;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);padding:5px 7px;display:inline-flex;align-items:center;gap:6px;
}
.lay[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.lay:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.sw{width:9px;height:9px;display:inline-block;background:var(--ink)}
.sw.k-walk{border-radius:50%}
.sw.k-eat{background:var(--rosso)}
.sw.k-buy{background:var(--sea);transform:rotate(45deg)}
.sw.k-screen{background:var(--reel);border-radius:50%}
.sw.k-taste{background:var(--olio);clip-path:polygon(50% 0,100% 100%,0 100%)}
.seg{display:inline-flex}
.lay.wide{border-color:var(--ink);color:var(--ink)}
.seg .lay+.lay{border-left-width:0}
.lay.wide[aria-pressed="true"]{background:var(--ink);color:var(--stone)}

/* ---------- the view: drawn chart or real map ---------- */
.viewbox{position:relative;margin:0 0 12px;border:1px solid var(--ink);background:var(--sand)}
.viewbox.chart{padding:8px}
.viewbox.chart svg{display:block;width:100%;height:auto;max-height:70vh;margin:0 auto}
.viewbox.map{height:min(62vh,470px);overflow:hidden;touch-action:none;background:#E4E0D6;
  cursor:grab}
.viewbox.map:active{cursor:grabbing}
.chart-empty{font-family:var(--mono);font-size:11px;color:var(--mute);text-align:center;padding:40px 0}
.tiles{position:absolute;inset:0;filter:saturate(.68) contrast(.97)}
.tiles img{position:absolute;display:block;max-width:none;user-select:none;
  -webkit-user-drag:none;pointer-events:none}
.tiles img.dead{display:none}
.ovl{position:absolute;inset:0;width:100%;height:100%}
.ovl .pin circle,.ovl .pin rect{stroke:#FBFAF6;stroke-width:1.2}
.ovl .pin .halo{fill:#FBFAF6;fill-opacity:.7;stroke:#131E28;stroke-width:1.4}
.ovl .route{stroke:#131E28;stroke-width:1.6;opacity:.8;
  filter:drop-shadow(0 0 1.5px rgba(251,250,246,.95))}
.ovl .route.taste{stroke:#4F6B2F;stroke-dasharray:5 4}
.attrib{position:absolute;right:0;bottom:0;background:rgba(251,250,246,.86);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.02em;color:var(--mute);padding:2px 5px}
.attrib a{color:var(--sea)}
.zoomctl,.fsctl{position:absolute;top:8px;display:flex;flex-direction:column;gap:5px}
.zoomctl{left:8px}
.fsctl{right:8px}
.zoomctl button,.fsctl button{width:32px;height:32px;padding:0;border:1px solid var(--ink);
  background:rgba(251,250,246,.93);color:var(--ink);font:17px/1 var(--mono);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.fsctl svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:square;pointer-events:none}

/* full screen — native where the browser allows it, a fixed overlay everywhere else
   (iPhone Safari still refuses requestFullscreen on anything but a video) */
.viewbox.map.fs{position:fixed;inset:0;z-index:80;width:100%;height:100%;margin:0;border:0}
.viewbox.map.fs .zoomctl,.viewbox.map.fs .fsctl{top:calc(8px + env(safe-area-inset-top))}
.viewbox.map.fs .zoomctl{left:calc(8px + env(safe-area-inset-left))}
.viewbox.map.fs .fsctl{right:calc(8px + env(safe-area-inset-right))}
.viewbox.map.fs .attrib{bottom:env(safe-area-inset-bottom)}
body.fsmap{overflow:hidden}

/* ---------- locator bar ---------- */
.locbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.locnote{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--mute);
  flex:1;min-width:0}
.locnote strong{color:var(--sea);font-weight:400}
.locnote.warn{color:var(--rosso)}
.fromhere{font-family:var(--mono);font-size:10.5px;color:var(--sea)}
#me{pointer-events:none}   /* never let the blue dot swallow a tap on a pin */
.me-acc{fill:#1D5A6E;fill-opacity:.13;stroke:#1D5A6E;stroke-width:.6;stroke-opacity:.45}
.me-dot{fill:#1D5A6E;stroke:#FBFAF6;stroke-width:2}
.me-arrow{fill:#1D5A6E}
.me-lbl{font-family:Menlo,monospace;font-size:8px;fill:#1D5A6E;letter-spacing:.04em}
.off{border-top:1px solid var(--rule);margin-top:16px;padding-top:12px}
.off h3,.index h3{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mute);font-weight:400;margin:0 0 8px}
.offrow{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--rule);
  font-size:13.5px}
.offrow:first-of-type{border-top:0}
.offrow .bearing{font-family:var(--mono);font-size:10.5px;color:var(--sea);white-space:nowrap}
.offrow .oname{flex:1;min-width:0}
.offrow .osub{display:block;font-size:12px;color:var(--mute)}
.index{margin-top:16px}
.ixrow{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:none;
  border:0;border-top:1px solid var(--rule);padding:7px 0;cursor:pointer;font:inherit;color:inherit}
.ixrow:first-of-type{border-top:0}
.ixrow .ixname{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.ixrow .ixsub{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mute);white-space:nowrap}
.ixrow[aria-current="true"] .ixname{font-weight:600}

/* ---------- chart internals (inline SVG) ---------- */
.gr line{stroke:#C9C6BB;stroke-width:.4;stroke-dasharray:2 3}
.tk{font-family:Menlo,monospace;font-size:6.5px;fill:#6E7378;letter-spacing:.04em}
.frm{fill:none;stroke:#C9C6BB;stroke-width:.8}
.route{fill:none;stroke:#131E28;stroke-width:1;stroke-dasharray:4 3;opacity:.5}
.route.taste{stroke:#4F6B2F;stroke-dasharray:1 3;opacity:.75}
.lead{stroke:#6E7378;stroke-width:.5}
.true{fill:#6E7378}
.pin{cursor:pointer}
.pin text{font-family:Menlo,monospace;font-size:9px;fill:#FBFAF6}
.pin:focus-visible{outline:none}
.pin .halo{fill:none;stroke:#131E28;stroke-width:1.2;visibility:hidden}
.pin.on .halo,.pin:focus-visible .halo{visibility:visible}
.bar line{stroke:#131E28;stroke-width:1}
.rose line{stroke:#131E28;stroke-width:.8}
.rose polygon{fill:#131E28}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--rule);margin-top:26px;padding:14px 0 0;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--mute);
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.reset{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;
  cursor:pointer;padding:0}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="kicker"><span>Shore Book</span><span id="today">—</span></div>
  <h1 id="portName">—</h1>
  <p class="sub" id="portSub">—</p>
</header>

<div class="ports" role="tablist" aria-label="Ports" id="portRail"></div>

<section class="tide" aria-live="polite">
  <div class="tide-top">
    <span class="tide-label">Back on board in</span>
    <span class="tide-clock" id="tideClock">—</span>
  </div>
  <div class="tide-track"><div class="tide-fill" id="tideFill" style="width:0%"></div></div>
  <div class="tide-foot">
    <label>Ashore <input type="time" id="ashore" step="300"></label>
    <label>All aboard <input type="time" id="allAboard" step="300"></label>
  </div>
</section>

<div class="dock" id="dock"></div>

<div class="tabs" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" data-tab="walk" aria-selected="true">Walk</button>
  <button class="tab" role="tab" data-tab="eat" aria-selected="false">Eat</button>
  <button class="tab" role="tab" data-tab="taste" aria-selected="false">Taste</button>
  <button class="tab" role="tab" data-tab="buy" aria-selected="false">Buy</button>
  <button class="tab" role="tab" data-tab="screen" aria-selected="false">Screen</button>
  <button class="tab" role="tab" data-tab="chart" aria-selected="false">Chart</button>
  <button class="tab" role="tab" data-tab="know" aria-selected="false">Know</button>
</div>

<main id="panel"></main>

<footer>
  <span>Adriatic · September 2026</span>
  <button class="reset" id="reset">Clear checkmarks</button>
</footer>

</div>

<script>
/* ============================================================
   DATA — six ports. Hours and prices drift; treat as a guide.
   Every entry carries a coordinate, "lat,lon" in decimal degrees.
   Stops and landmarks are surveyed to the door; shops, kitchens
   and film marks are good to a block, which is all you need on foot.
   ============================================================ */
const PORTS = [
{
  id:"venice", name:"Venice", sub:"Italy · in port 11–14 September · Ai Reali",
  aboard:"19:00", ashore:"09:00",
  dock:{t:"Staying ashore — Ai Reali, Castello",
        d:"Rialto 5 min on foot. Vaporetto: Rialto (Line 1/2) and San Zaccaria for the Giudecca side."},
  stops:[
    {n:"Rialto Market", dur:35, leg:6,
     w:"The Erberia (produce) and Pescaria (fish) have fed the city from this bend in the Grand Canal since the 11th century. Best before 10:00, when it is still a working market rather than a photograph of one.",
     l:"The stone plaques on the Pescaria columns setting minimum legal fish sizes — a medieval fisheries regulation still bolted to the wall.",
     x:"Fish market closed Sunday and Monday. Produce closed Sunday.",
     c:"45.4389,12.3346"},
    {n:"Rialto Bridge", dur:10, leg:14,
     w:"Antonio da Ponte beat Palladio and Michelangelo for the commission in 1588 and built in stone what had collapsed twice in wood.",
     l:"Stand on the Riva del Vin side instead of the bridge itself. The bridge is better seen than stood on.",
     x:"Crossing takes minutes at 08:00 and a quarter hour at midday.",
     c:"45.4380,12.3358"},
    {n:"Piazza San Marco & the Basilica", dur:70, leg:10,
     w:"A Byzantine church in a Gothic square, plated in loot. The mosaics run to roughly four thousand square metres of gold ground.",
     l:"The Pala d'Oro behind the high altar, and the four bronze horses upstairs in the museum — the ones outside are copies.",
     x:"Book the basilica slot online; the walk-up line is the longest in Italy. Shoulders and knees covered. Large bags refused.",
     c:"45.4345,12.3397"},
    {n:"Doge's Palace", dur:80, leg:22,
     w:"Government, courts and prison in one building — which is exactly the point the architecture is making.",
     l:"The Bocca di Leone letterboxes for anonymous denunciations, and the tiny cell doors past the Bridge of Sighs.",
     x:"Secret Itineraries tour is worth the premium and must be booked ahead.",
     c:"45.4337,12.3401"},
    {n:"Santa Maria Gloriosa dei Frari", dur:40, leg:8,
     w:"A vast brick Franciscan barn holding Titian's Assumption above the altar — painted for this exact light, in this exact frame.",
     l:"Titian's own tomb, and Monteverdi's, both in the same church.",
     x:"Closed to visitors during Sunday morning mass. Small admission.",
     c:"45.4370,12.3266"},
    {n:"Scuola Grande di San Rocco", dur:45, leg:16,
     w:"Tintoretto spent twenty-three years covering the ceilings and walls. It is the closest thing Venice has to a Sistine Chapel and it is usually half empty.",
     l:"Take one of the mirrors by the door and walk the upper hall looking down — your neck will thank you.",
     x:"Admission around €10.",
     c:"45.4368,12.3260"},
    {n:"Zattere at golden hour", dur:45, leg:0,
     w:"The southern quay faces Giudecca across open water — the one place in Venice with a horizon and a breeze.",
     l:"Palladio's Redentore directly opposite, best lit in the last hour before sunset.",
     x:"Gelato at Nico, on the quay, since 1935.",

  eat:[

  tasteNote:"Venice eats standing up. A cicchetto is one mouthful on bread or a stick, an ombra is the small glass of wine that goes with it, and the pair costs a fraction of a sat-down meal. Go in the morning: the bars cook what the market had at seven and they sell out.",
  taste:[
    {n:"Pasticceria Rizzardini", sp:"Krapfen and an espresso", pr:"€3–4", dur:15, leg:5,
     d:"A pasticceria of 1742 in a campiello two minutes south of the Rialto, with a marble counter and nowhere much to sit. Venetian breakfast is taken upright and takes four minutes.",
     o:"A krapfen or a handful of zaeti — the cornmeal-and-raisin biscuits. Espresso, or a macchiato. No cappuccino past eleven unless you want to be spotted.",
     x:"Cash is quickest. Closed Tuesday. Coffee at the bar costs roughly a third of coffee at a table, by law.",
     c:"45.4363,12.3296"},
    {n:"All'Arco", sp:"Cicchetti", pr:"€2–3 each", dur:25, leg:2,
     d:"Fifty metres behind the Pescaria, which is the whole explanation. Father and son build the day's cicchetti from what crossed the market counter that morning and stop when it is gone.",
     o:"Baccalà mantecato on white polenta, sarde in saor, and whichever raw crudo is on the board. An ombra of Soave with it.",
     x:"Standing room and a shelf. Shuts mid-afternoon and does no dinner. Closed Sunday, and Saturday afternoon when the market is quiet.",
     c:"45.4382,12.3331"},
    {n:"Cantina Do Mori", sp:"Francobolli and an ombra", pr:"€2–4", dur:15, leg:5,
     d:"Pouring since 1462, which makes it the oldest bacaro in the city. Dark, narrow, hung with copper pans, and you will be shoulder to shoulder with someone's grandfather.",
     o:"Francobolli — postage-stamp sandwiches, half a dozen fillings — and a glass of whatever red is open.",
     x:"No seats at all, by design. Cash. Closed Sunday.",

    {n:"Acqua e Mais", sp:"Fritto misto in a cone", pr:"€5–8", dur:10, leg:14,

    {n:"Osteria alla Vedova", sp:"Polpette", pr:"€2 each", dur:25, leg:25,
     d:"Cannaregio, over the Rialto and north, past the point where the day-trippers turn back. The fried meatball here is the single most argued-about mouthful in Venice and it is worth the walk.",

    {n:"Gelateria Nico, Zattere", sp:"Gianduiotto da passeggio", pr:"€4–6", dur:20, leg:0,

     o:"Gianduiotto da passeggio, then walk west along the Zattere with it.",

    {n:"City Walls circuit", dur:105, leg:5,

  taste:[

    {n:"Kamenice", sp:"Ston oysters", pr:"€2–3 each", dur:25, leg:3,

    {n:"Peppino's", sp:"Gelato", pr:"€3–5", dur:10, leg:5,

     o:"Fig, or the local honey, or anything carrying rosemary or lavender.",

  ],
  tasteNote:"Montenegro's coast cooks Venetian and its mountains cook Balkan, and Kotor is the seam between them. The best of it comes down from Njeguši, a village at 900 m on the Cetinje road, and is sold on a market table two hundred metres from where the ship ties up.",
  taste:[
    {n:"The market outside the Sea Gate", sp:"Njeguši pršut, cheese in oil, figs", pr:"€5–15", dur:25, leg:3,
     d:"Open tables along the wall between the berth and the gate. The bura wind dries ham at Njeguši better than anywhere on this coast; the cheese comes down the mountain in jars of its own oil.",
     o:"A hundred grams of pršut cut in front of you, a jar of cheese, dried figs, walnuts, and a pot of mountain honey.",
     x:"Mornings — best before 11:00. Cash. Vacuum-packed ham travels, but check your own customs allowance before buying meat.",
     c:"42.4239,18.7699"},
    {n:"The bakery on the Square of Arms", sp:"Burek and drinking yoghurt", pr:"€2–4", dur:15, leg:2,
     d:"Burek is the Balkan breakfast: filo coiled into a round tray, baked, cut by weight and handed over hot in paper. Meat, cheese, spinach or potato, and it is eaten before nine.",
     o:"Sirnica — the cheese coil — by weight, and a kefir or drinking yoghurt to cut it.",
     x:"Open from around 07:00, which makes this the right thing to hold before the fortress climb rather than after it. Cash.",
     c:"42.4247,18.7708"},
    {n:"Bokun", sp:"Njeguši board and a glass of Vranac", pr:"€8–14", dur:30, leg:2,
     d:"A small wine bar in the lanes that pours Montenegrin and nothing else. Vranac is the black grape of the Zeta valley; Krstač is the white, and is grown almost nowhere outside this country.",
     o:"The prosciutto and cheese board, a glass of Vranac, then a glass of Krstač to see the difference.",
     x:"Stone, shade and quiet — useful between 13:00 and 15:00 when the walled town turns into an oven.",
     c:"42.4247,18.7712"},
    {n:"Konoba Scala Santa", sp:"Priganice with honey and kajmak", pr:"€5–7", dur:25, leg:6,
     d:"Priganice are knuckles of yeast dough dropped into hot oil and eaten immediately, sweet with honey or salted with young cheese. Every Montenegrin grandmother makes them; the konobas keep the habit alive for everyone else.",
     o:"A plate of priganice with honey and kajmak, shared between two.",
     x:"The one plate here you sit down for. Lamb under the sač is the other house dish and needs ordering hours ahead.",
     c:"42.4249,18.7719"},
    {n:"Tanjga", sp:"Ćevapi off the grill", pr:"€6–10", dur:30, leg:0,
     d:"Outside the walls by the Škurda, a yard of charcoal grills and plastic chairs where Kotor eats when it is not selling lunch to a ship. Meat by weight, bread, raw onion, no menu worth reading.",
     o:"Ćevapi or a pljeskavica in lepinja, with kajmak and onion. Order by the ten.",
     x:"Cash, and cheap enough to be suspicious of until it arrives. Ten minutes on foot from the Sea Gate.",

{

  stops:[
    {n:"Fortica Španjola", dur:70, leg:15,

     l:"The cisterns and the small collection of amphorae in the vaults.",

     x:"",

    {n:"Arsenal & Hvar Theatre", dur:30, leg:3,
     w:"The arsenal repaired war galleys under its great arch. In 1612 the town put a public theatre on the upper floor — open to nobles and commoners alike, which was close to unheard of.",

    {n:"Cathedral of St Stephen", dur:25, leg:7,

  eat:[

    {n:"Dalmatino", t:"Sit-down", d:"Small, loud, extremely popular. Reserve days ahead or do not bother.", c:"43.1729,16.4415"},

    {n:"Fig Café", t:"Casual", d:"Breakfast and light lunch, run by expats, reliably good coffee.", c:"43.1726,16.4413"}
  ],
  tasteNote:"Hvar town's restaurant prices are set by the yachts in the harbour. The island's own food is not: figs, almonds, capers, salted anchovies and cakes that predate the nightclubs by four centuries — all of it within three minutes of the main square.",
  taste:[
    {n:"The morning market by the Arsenal", sp:"Figs, almonds, capers, lavender honey", pr:"€4–10", dur:20, leg:2,
     d:"A handful of tables at the harbour end of St Stephen's Square. September is fig season and the island dries them on racks in the sun; the capers grow wild out of the same walls you have been photographing all morning.",
     o:"Dried figs, almonds, a jar of salted capers, and lavender or rosemary honey.",
     x:"Mornings only and small — if a ship is in, go before 10:00. Cash.",
     c:"43.1724,16.4424"},
    {n:"Nonica", sp:"Forška torta, rafioli, paprenjak", pr:"€2–4 each", dur:15, leg:2,
     d:"A one-room cake shop making the island's traditional sweets to household recipes. The forška torta is Hvar's almond cake; rafioli are almond paste folded into pastry; paprenjak is a peppered honey biscuit that went to sea because it kept for months.",
     o:"One of each in a paper bag, eaten on the square. The paprenjak is the one that survives a rucksack.",
     x:"Small, and it sells out by the afternoon. Cash preferred.",
     c:"43.1726,16.4423"},
    {n:"Fig Café", sp:"Coffee and something fried", pr:"€4–8", dur:20, leg:3,
     d:"Expat-run, tiny, and the most reliable coffee in a town that treats coffee as a competitive sport. Also the easiest breakfast if you are ashore early for the fortress.",
     o:"Coffee and whatever is chalked up. Take it away and drink it on the harbour wall.",
     x:"Queues at breakfast. Cash and card.",
     c:"43.1726,16.4413"},
    {n:"3 Pršuta", sp:"Pršut, island cheese, Plavac Mali", pr:"€10–16", dur:30, leg:3,
     d:"A narrow wine bar off the square pouring Dalmatian bottles by the glass. Plavac Mali is the island's black grape, grown on the southern slopes at Sveta Nedjelja on a gradient you would not willingly walk up.",
     o:"A pršut and cheese board, a glass of Plavac from the south side, and a taste of Prošek to finish.",
     x:"Standing room and two or three tables. Fills after 19:00 and stays full.",
     c:"43.1727,16.4417"},
    {n:"Konoba Menego", sp:"Cured meat, cheese, marinated anchovies", pr:"€15–25", dur:45, leg:0,
     d:"Up the steps behind the square, stone-walled, candlelit and stubbornly unmodernised. There is no pizza and no pasta — only what the island cures, pickles, salts and grows.",
     o:"The board of cured meats and cheese, marinated anchovies, and a carafe of the house red.",
     x:"The one place on this tour to sit down properly. Small — go at opening or reserve.",
     c:"43.1727,16.4420"}
  ],
  buy:[
    {n:"Agave lace", d:"From the Benedictine convent only. Anything sold on the riva as Hvar lace is not this.", c:"43.1729,16.4425"},
    {n:"Lavender", d:"The island's signature crop. Oil and dried bundles from the market stalls; check for a Hvar producer, since much sold here is imported.", c:"43.1724,16.4425"},
    {n:"Island wine", d:"Plavac Mali from the southern slopes at Sveta Nedjelja. Zlatan Otok and Tomić are the names to look for.", c:"43.1725,16.4418"}

  screen:[

    {n:"The Pakleni islands", f:"The Deep — Orson Welles, unfinished", y:"1967–69", r:"A yacht, becalmed",

  tasteNote:"Zadar is a working city that feeds itself rather than its visitors, which makes it the best value on this coast. The market is the whole argument: sheep's cheese from the island up the channel, salt raked by hand at Nin, and a cherry liqueur industrialised on this street in 1821.",
  taste:[
    {n:"Green market & fish hall", sp:"Paški sir, Nin salt, figs, šokol", pr:"€5–15", dur:30, leg:2,
     d:"An open square and two halls behind the Roman forum. Pag cheese is sheep's milk off an island with almost no soil, where the flock grazes on herbs the bura has blown salt into — it tastes of precisely that, and nothing else does.",
     o:"A wedge of aged Paški sir, a bag of Nin salt, September figs, and šokol — the cured neck the Nin butchers make.",

    {n:"Konoba Skoblar", sp:"Fried girice and grilled sardines", pr:"€8–14", dur:30, leg:4,
     d:"On the edge of the market, so the fish has travelled about forty metres. Small fish fried whole is the Dalmatian working lunch — priced by the kilo, eaten with bread and chard, no plating involved.",

     x:"Grilled fish is sold by weight. Ask the price per kilo before you nod at the tray — this is normal and nobody minds.",

    {n:"Kavana Danica", sp:"Coffee and a slice", pr:"€4–7", dur:30, leg:9,

     o:"A macchiato and whatever is under the glass dome — rafioli if they have them.",

    {n:"The riva kiosks & the Sea Organ", sp:"Ice cream at sunset", pr:"€2–4", dur:40, leg:0,

  screen:[

  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ delete mem[k]; try{ localStorage.removeItem(k); }catch(e){} }
};

/* ============================================================
   HELPERS
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm = m => { const h = Math.floor(m/60), r = Math.round(m%60);
  return h ? h + "h " + String(r).padStart(2,"0") + "m" : r + "m"; };

function minsToday(t){ if(!t) return null; const [h,m] = t.split(":").map(Number); return h*60+m; }
function nowMins(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function clockFromMins(m){ m = ((m % 1440) + 1440) % 1440;
  return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); }

/* --- geography --------------------------------------------- */
const RAD = Math.PI/180;
function ll(c){
  if(!c) return null;
  const p = String(c).split(",").map(Number);
  return (p.length===2 && isFinite(p[0]) && isFinite(p[1])) ? {lat:p[0], lon:p[1]} : null;
}
function kmBetween(a,b){
  const dLat=(b.lat-a.lat)*RAD, dLon=(b.lon-a.lon)*RAD;
  const s = Math.sin(dLat/2)**2 +
            Math.cos(a.lat*RAD)*Math.cos(b.lat*RAD)*Math.sin(dLon/2)**2;
  return 2*6371*Math.asin(Math.min(1,Math.sqrt(s)));
}
const COMPASS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
function compass(a,b){
  const y = Math.sin((b.lon-a.lon)*RAD)*Math.cos(b.lat*RAD);
  const x = Math.cos(a.lat*RAD)*Math.sin(b.lat*RAD) -
            Math.sin(a.lat*RAD)*Math.cos(b.lat*RAD)*Math.cos((b.lon-a.lon)*RAD);
  const deg = (Math.atan2(y,x)/RAD + 360) % 360;
  return COMPASS[Math.round(deg/22.5) % 16];
}
const dist = km => km < 1 ? Math.round(km*1000) + " m" : km.toFixed(km<10?1:0) + " km";

/* --- the one list everything else reads --------------------- */
function points(p){
  const out = [];
  p.stops.forEach((s,i) => out.push(
    {k:"walk", i, num:i+1, n:s.n, c:s.c, sub:s.dur+" min", d:s.w, x:s.x}));
  (p.eat||[]).forEach((s,i) => out.push(
    {k:"eat", i, num:i+1, n:s.n, c:s.c, sub:"", tag:s.t, d:s.d}));
  (p.taste||[]).forEach((s,i) => out.push(
    {k:"taste", i, num:i+1, n:s.n, c:s.c, sub:s.sp + " · " + s.pr, tag:"Food tour " + (i+1),
     d:s.d, x:s.o + (s.x ? " " + s.x : "")}));
  (p.buy||[]).forEach((s,i) => out.push(
    {k:"buy", i, num:i+1, n:s.n, c:s.c, sub:"", d:s.d}));
  (p.screen||[]).forEach((s,i) => out.push(
    {k:"screen", i, num:i+1, n:s.n, c:s.c, sub:s.f + " · " + s.y, tag:s.r, d:s.d, x:s.x}));
  return out;
}
const keyOf = o => o.k + ":" + o.i;
const plotted = p => points(p).filter(o => ll(o.c));
function townCentre(p){
  const pts = p.stops.map(s => ll(s.c)).filter(Boolean);
  if(!pts.length) return {lat:0, lon:0};
  return {lat: pts.reduce((a,b)=>a+b.lat,0)/pts.length,
          lon: pts.reduce((a,b)=>a+b.lon,0)/pts.length};
}
const mapsHref = (c,n) => "https://maps.apple.com/?ll=" + c + "&q=" + encodeURIComponent(n);

  $("#ashore").value = store.get(timeKey(cur,"ashore")) || p.ashore;

}

function renderTide(){
  const a = minsToday($("#ashore").value), b = minsToday($("#allAboard").value);
  const n = nowMins(), clock = $("#tideClock"), fill = $("#tideFill");
  if(a===null || b===null || b<=a){ clock.textContent = "—"; fill.style.width = "0%"; return; }
  const left = b - n;
  const onShoreDay = n >= a && n <= b;
  if(onShoreDay){
    clock.textContent = hhmm(left);
    clock.classList.toggle("warn", left <= 60);
    fill.style.width = Math.min(100, Math.max(0, ((n-a)/(b-a))*100)) + "%";
  } else {
    clock.textContent = hhmm(b-a);
    clock.classList.remove("warn");
    fill.style.width = "0%";
  }
}

/* ============================================================
   RENDER — walk
   ============================================================ */
function renderWalk(){
  const p = port(), done = getDone();
  let out = "";

  // projection from first unchecked stop
  const first = p.stops.findIndex((s,i) => !done.includes(i));
  const b = minsToday($("#allAboard").value);
  if(first > -1 && b !== null){
    let need = 0;
    for(let i=first;i<p.stops.length;i++){ if(done.includes(i)) continue;
      need += p.stops[i].dur + (i < p.stops.length-1 ? p.stops[i].leg : 0); }
    const finish = nowMins() + need;
    const slack = b - finish;
    out += '<div class="proj' + (slack < 30 ? " tight" : "") + '"><b>If you start now</b>' +
      'Remaining stops need <strong>' + hhmm(need) + '</strong> — finishing around <strong>' +
      clockFromMins(finish) + '</strong>. ' +
      (slack >= 0
        ? 'That leaves ' + hhmm(slack) + ' before all aboard.'
        : '<strong>That is ' + hhmm(-slack) + ' past all aboard. Cut something.</strong>') +
      '</div>';
  }

  out += '<ol class="rail">' + p.stops.map((s,i) => {
    const isDone = done.includes(i);
    return '<li class="stop' + (isDone?" done":"") + '" data-i="' + i + '">' +
      '<button class="dot" data-check="' + i + '" aria-label="Mark ' + esc(s.n) + ' done">' +
        (isDone ? "&#10003;" : (i+1)) + '</button>' +
      '<div class="stop-head" data-open="' + i + '">' +
        '<span class="stop-name">' + esc(s.n) + '</span>' +
        '<span class="stop-dur">' + s.dur + ' min</span>' +
      '</div>' +
      '<div class="stop-body">' +
        '<p>' + esc(s.w) + '</p>' +
        (s.l ? '<div class="look"><b>Look for</b>' + esc(s.l) + '</div>' : '') +
        (s.x ? '<p style="margin-top:8px;color:var(--mute);font-size:13.5px">' + esc(s.x) + '</p>' : '') +
        '<a class="geo" href="' + mapsHref(s.c, s.n) + '">' + s.c + ' · Maps</a>' +
        '<button class="geo btn" data-goto="walk:' + i + '">On chart</button>' +
        (i < p.stops.length-1 ? '<div class="leg">&darr; ' + s.leg + ' min walk to ' +
          esc(p.stops[i+1].n) + '</div>' : '') +
      '</div></li>';
  }).join("") + '</ol>';

  return out;
}

/* ============================================================
   WHERE AM I — the phone's own GPS. Needs no signal, only sky.
   ============================================================ */
const geo = {on:false, fix:null, err:null, id:null};

function startGeo(){
  if(!("geolocation" in navigator)){ geo.err = "This browser has no location service."; onFix(); return; }
  if(!window.isSecureContext){ geo.err = "Location needs a secure (https) page."; onFix(); return; }
  geo.on = true; geo.err = null; store.set("sb.geo","1");
  try{
    geo.id = navigator.geolocation.watchPosition(
      p => { geo.fix = {lat:p.coords.latitude, lon:p.coords.longitude,
                        acc:p.coords.accuracy || 0, t:p.timestamp};
             geo.err = null; onFix(); },
      e => { geo.err = e.code === 1
               ? "Location refused. Allow it for this site in your browser settings."
               : e.code === 2
               ? "No fix yet. GPS wants a view of the sky; stone alleys are slow."
               : "Location timed out. Try again in the open.";
             onFix(); },
      {enableHighAccuracy:true, maximumAge:4000, timeout:25000});
  }catch(e){ geo.on = false; geo.err = "Location unavailable."; onFix(); }
}
function stopGeo(){
  try{ if(geo.id != null) navigator.geolocation.clearWatch(geo.id); }catch(e){}
  geo.id = null; geo.on = false; geo.fix = null; geo.err = null;
  store.del("sb.geo"); onFix();
}
function onFix(){
  if(tab !== "chart") return;
  paintLocBar();
  if(mode === "map" && geo.fix && followMe) centreOn(geo.fix.lat, geo.fix.lon);
  else paintMe();
}
function nearestTo(fix){
  let best = null;
  plotted(port()).forEach(o => {
    if(!layers[o.k]) return;
    const L = ll(o.c), d = kmBetween(fix, L);
    if(!best || d < best.km) best = {o, L, km:d};
  });
  return best;
}

/* ============================================================
   RENDER — the view. Two of them:
     chart  a drawn plot from the coordinates. No network, ever.
     map    real OpenStreetMap tiles, when there is a signal.
   Both carry the same pins and both show your own position.
   ============================================================ */
const VB = {w:380, l:24, r:12, t:12, b:24};   /* height is set per chart, from the ground */
let mode = (store.get("sb.mode") === "map") ? "map" : "chart";
let mapView = null;                 /* {lat, lon, z} — rebuilt per port */
let followMe = false;
let mapFull = false;                /* map blown up to the whole screen */
let proj = null;                    /* {toXY, W, H, mPerUnit, svg} for whichever view is up */
let tiles = new Map();              /* live tile <img> elements, keyed z/x/y */

const TILE_URL = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
const MINZ = 11, MAXZ = 19;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* --- Web Mercator, the projection the tiles are cut on ------- */
const mercY = lat => Math.log(Math.tan(Math.PI/4 + clamp(lat,-85,85)*RAD/2));
function worldPx(lat, lon, z){
  const s = 256*Math.pow(2, z);
  return {x:(lon+180)/360*s, y:(0.5 - mercY(lat)/(2*Math.PI))*s};
}
function pxToLL(x, y, z){
  const s = 256*Math.pow(2, z);
  return {lon: x/s*360 - 180,
          lat: (2*Math.atan(Math.exp((0.5 - y/s)*2*Math.PI)) - Math.PI/2)/RAD};
}
const mPerPx = (lat, z) => 156543.03392*Math.cos(lat*RAD)/Math.pow(2, z);

/* --- the working set ---------------------------------------- */
function chartSets(){
  const p = port(), centre = townCentre(p);
  const all = plotted(p).map(o => Object.assign({}, o, {ll: ll(o.c)}));
  const near = all.filter(o => kmBetween(centre, o.ll) <= TOWN_KM);
  const far  = all.filter(o => kmBetween(centre, o.ll) >  TOWN_KM);
  const pool = (mode === "map" || fitAll) ? all : near;
  return {p, centre, all, near, far, shown: pool.filter(o => layers[o.k])};
}

/* ============================================================
   The shell — toolbar, locator bar, view host, card, index
   ============================================================ */
function chartShell(){
  const s = chartSets();
  let html = '<div class="tools">' +
    '<span class="seg">' +
      '<button class="lay wide" data-setmode="chart" aria-pressed="' + (mode==="chart") +

        '">Map</button></span>' +
    Object.keys(KIND).map(k => {
      const n = s.all.filter(o => o.k===k).length;
      return '<button class="lay" data-layer="' + k + '" aria-pressed="' + !!layers[k] + '">' +
        '<span class="sw k-' + k + '"></span>' + esc(KIND[k].t) + ' ' + n + '</button>';
    }).join("") +

      ? '<button class="lay" data-fitport="1">Fit port</button>'
      : '<button class="lay" data-fit="1" aria-pressed="' + fitAll + '">' +
        (fitAll ? "Whole coast" : "Town only") + '</button>') +
    '<button class="lay" data-gpx="1">Download .gpx</button>' +
  '</div>';

  html += '<div class="locbar" id="locbar"></div>';
  html += '<div class="viewbox ' + mode + (mode==="map" && mapFull ? ' fs' : '') +
          '" id="viewbox"></div>';
  html += '<div id="chartCard"></div>';

  html += '<div class="index"><h3>Index</h3>' + (s.shown.length
    ? s.shown.map(o => {
        const k = keyOf(o);
        return '<button class="ixrow" data-pin="' + k + '" aria-current="' + (sel===k) + '">' +
          glyph(o.k, o.num) + '<span class="ixname">' + esc(o.n) + '</span>' +
          '<span class="ixsub">' + esc(KIND[o.k].t) + '</span></button>';
      }).join("")
    : '<p class="sec-note">Nothing plotted — switch a layer back on.</p>') +
    '<p class="sec-note" style="margin-top:12px">Decimal degrees, WGS 84 — the same numbers your ' +
    'phone reads. Stops and landmarks are surveyed to the door; kitchens, shops and film marks are ' +
    'good to a block, which is all you need on foot.' +
    (mode==="chart" ? ' Where two pins would collide on the chart the marker is nudged clear and a ' +
      'hairline points back to the true position.' : '') + '</p></div>';

  html += offList(s.far, s.centre);
  return html;
}

function offList(far, centre){
  if(mode === "map" || fitAll || !far.length) return "";
  const rows = far.filter(o => layers[o.k]).sort((a,b) =>
    kmBetween(centre,a.ll) - kmBetween(centre,b.ll));
  if(!rows.length) return "";
  return '<div class="off"><h3>Off the chart</h3>' + rows.map(o =>
    '<div class="offrow">' + glyph(o.k, o.num) +
      '<span class="oname">' + esc(o.n) +
        '<span class="osub">' + esc(o.sub || "") + '</span></span>' +
      '<span class="bearing">' + compass(centre, o.ll) + ' ' + dist(kmBetween(centre, o.ll)) + '</span>' +
    '</div>').join("") +
    '<p class="sec-note" style="margin-top:10px">Bearings and distances are from the middle of the ' +
    'old town. Switch to <strong>whole coast</strong>, or to the map, to plot them.</p></div>';
}

function drawView(){
  if(mode === "map") drawMap(); else drawChart();
  paintMe(); paintSel(); paintLocBar();
}

/* ============================================================
   Locator bar
   ============================================================ */
function paintLocBar(){
  const bar = $("#locbar"); if(!bar) return;
  let html;
  if(!geo.on){
    html = '<button class="lay" data-geo="on">Show where I am</button>' +
      '<span class="locnote">The phone\'s own GPS. It works with no signal.</span>';
  } else if(geo.err){
    html = '<button class="lay" data-geo="off" aria-pressed="true">Location on</button>' +
      '<span class="locnote warn">' + esc(geo.err) + '</span>';
  } else if(!geo.fix){
    html = '<button class="lay" data-geo="off" aria-pressed="true">Location on</button>' +
      '<span class="locnote">Waiting for a fix…</span>';
  } else {
    const n = nearestTo(geo.fix);
    html = '<button class="lay" data-geo="off" aria-pressed="true">Location on</button>' +
      (mode === "map"
        ? '<button class="lay" data-geo="follow" aria-pressed="' + followMe + '">Follow</button>'
        : '') +
      '<span class="locnote">&plusmn;' + Math.round(geo.fix.acc) + ' m' +
        (n ? ' &middot; nearest ' + esc(n.o.n) + ' <strong>' + dist(n.km) + ' ' +
             compass(geo.fix, n.L) + '</strong>' : '') + '</span>';
  }
  bar.innerHTML = html;
}

/* ============================================================
   Your position, painted into whichever view is up
   ============================================================ */
function paintMe(){
  if(!proj || !proj.svg || !proj.svg.isConnected) return;
  const old = proj.svg.querySelector("#me"); if(old) old.remove();
  if(!geo.on || !geo.fix) return;

  const NS = "http://www.w3.org/2000/svg";
  const g = document.createElementNS(NS, "g");
  g.setAttribute("id","me");
  const pt = proj.toXY(geo.fix.lat, geo.fix.lon);
  const inside = pt.x >= 2 && pt.x <= proj.W-2 && pt.y >= 2 && pt.y <= proj.H-2;

  if(inside){
    const r = clamp(geo.fix.acc/proj.mPerUnit, 5, proj.W);
    g.innerHTML =
      '<circle class="me-acc" cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) +
        '" r="' + r.toFixed(1) + '"/>' +
      '<circle class="me-dot" cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="5"/>';
  } else {
    /* off the edge — point at it, and say how far */
    const cx = proj.W/2, cy = proj.H/2;
    const dx = pt.x - cx, dy = pt.y - cy;
    const m = Math.max(Math.abs(dx)/(proj.W/2 - 16), Math.abs(dy)/(proj.H/2 - 16), 1e-6);
    const ex = cx + dx/m, ey = cy + dy/m;
    const ang = Math.atan2(dy, dx)*180/Math.PI + 90;
    const centre = townCentre(port());
    g.innerHTML =
      '<g transform="translate(' + ex.toFixed(1) + ',' + ey.toFixed(1) + ') rotate(' +
        ang.toFixed(1) + ')"><polygon class="me-arrow" points="0,-10 6.5,6 -6.5,6"/></g>' +
      '<text class="me-lbl" x="' + clamp(ex, 30, proj.W-30).toFixed(1) + '" y="' +
        clamp(ey + (dy>0 ? -14 : 20), 12, proj.H-6).toFixed(1) +
        '" text-anchor="middle">you &middot; ' +
        esc(dist(kmBetween(centre, geo.fix)) + " " + compass(centre, geo.fix)) + '</text>';
  }
  proj.svg.appendChild(g);
}

/* ============================================================
   Selection — patched in place so the map is not torn down
   ============================================================ */
function paintSel(){
  const host = $("#chartCard");
  if(host){
    const o = chartSets().shown.find(x => keyOf(x) === sel);
    host.innerHTML = o ? card(o) : "";
  }
  document.querySelectorAll(".ixrow").forEach(r =>
    r.setAttribute("aria-current", r.dataset.pin === sel));
  document.querySelectorAll("g[data-pin]").forEach(g =>
    g.classList.toggle("on", g.dataset.pin === sel));
}

function selectPin(k, centreIt){
  sel = (sel === k && !centreIt) ? null : k;
  if(mode === "map"){
    if(sel && centreIt){
      const o = chartSets().all.find(x => keyOf(x) === sel);
      if(o){ followMe = false; mapView.lat = o.ll.lat; mapView.lon = o.ll.lon;
             mapView.z = Math.max(mapView.z, 17); drawMap(); paintMe(); }
    } else drawOverlay();
  } else { drawChart(); paintMe(); }
  paintSel(); paintLocBar();
}

/* ============================================================
   The drawn chart — no tiles, no network
   ============================================================ */
const GRID_STEPS = [0.5,0.2,0.1,0.05,0.02,0.01,0.005,0.002,0.001,0.0005];
const BAR_STEPS  = [10,20,50,100,200,500,1000,2000,5000,10000,20000,50000];
function niceStep(span){
  for(const s of GRID_STEPS){ const n = span/s; if(n >= 2 && n <= 6) return s; }
  return GRID_STEPS[GRID_STEPS.length-1];
}

function drawChart(){
  const host = $("#viewbox"); if(!host) return;
  tiles = new Map();
  const {p, shown} = chartSets();
  if(!shown.length){
    host.innerHTML = '<div class="chart-empty">Nothing to plot — switch a layer back on.</div>';
    proj = null; return;
  }

  /* equirectangular, north up */
  const centre = townCentre(p);
  const kx = Math.cos(centre.lat * RAD);
  const px = o => o.ll.lon * kx, py = o => -o.ll.lat;
  let x0 = Math.min(...shown.map(px)), x1 = Math.max(...shown.map(px));
  let y0 = Math.min(...shown.map(py)), y1 = Math.max(...shown.map(py));
  const MINSPAN = 0.0035;                       /* ~390 m — stops absurd zoom */
  if(x1-x0 < MINSPAN*kx){ const m=(x0+x1)/2, h=MINSPAN*kx/2; x0=m-h; x1=m+h; }
  if(y1-y0 < MINSPAN){ const m=(y0+y1)/2, h=MINSPAN/2; y0=m-h; y1=m+h; }
  const padX = (x1-x0)*0.10, padY = (y1-y0)*0.10;
  x0-=padX; x1+=padX; y0-=padY; y1+=padY;

  /* the frame takes the shape of the ground, within reason — no dead paper */
  const iw = VB.w - VB.l - VB.r;
  const ih = Math.round(Math.min(Math.max(iw*((y1-y0)/(x1-x0)), iw*0.62), iw*1.30));
  const H  = ih + VB.t + VB.b;
  const scale = Math.min(iw/(x1-x0), ih/(y1-y0));
  const cx = (x0+x1)/2, cy = (y0+y1)/2;
  const SX = v => VB.l + iw/2 + (v - cx)*scale;
  const SY = v => VB.t + ih/2 + (v - cy)*scale;

  /* graticule */
  const latStep = niceStep(y1-y0), lonStep = niceStep((x1-x0)/kx);
  const dec = s => Math.max(0, Math.ceil(-Math.log10(s)));
  let grid = "", ticks = "";
  for(let v = Math.ceil(-y1/latStep)*latStep; v <= -y0+1e-9; v += latStep){
    const Y = SY(-v);
    grid += '<line x1="' + VB.l + '" y1="' + Y.toFixed(1) + '" x2="' + (VB.w-VB.r) +
            '" y2="' + Y.toFixed(1) + '"/>';
    ticks += '<text x="' + (VB.l-3) + '" y="' + (Y+3).toFixed(1) +
             '" text-anchor="end" class="tk">' + v.toFixed(dec(latStep)) + '</text>';
  }
  for(let v = Math.ceil((x0/kx)/lonStep)*lonStep; v <= x1/kx+1e-9; v += lonStep){
    const X = SX(v*kx);
    grid += '<line x1="' + X.toFixed(1) + '" y1="' + VB.t + '" x2="' + X.toFixed(1) +
            '" y2="' + (H-VB.b) + '"/>';
    ticks += '<text x="' + X.toFixed(1) + '" y="' + (H-VB.b+11) +
             '" text-anchor="middle" class="tk">' + v.toFixed(dec(lonStep)) + '</text>';
  }

  /* walking route, and the food tour's own line under it */
  let route = "";
  const walk = shown.filter(o => o.k==="walk").sort((a,b)=>a.i-b.i);
  if(walk.length > 1){
    route = '<polyline class="route" points="' +
      walk.map(o => SX(px(o)).toFixed(1) + "," + SY(py(o)).toFixed(1)).join(" ") + '"/>';
  }
  const tour = shown.filter(o => o.k==="taste").sort((a,b)=>a.i-b.i);
  if(tour.length > 1){
    route += '<polyline class="route taste" points="' +
      tour.map(o => SX(px(o)).toFixed(1) + "," + SY(py(o)).toFixed(1)).join(" ") + '"/>';
  }

  /* de-collide markers, keeping a leader to the true spot */
  const nodes = shown.map(o => {
    const X = SX(px(o)), Y = SY(py(o));
    return {o, x0:X, y0:Y, x:X, y:Y};
  });
  const MIN = 22, CAP = 26;
  for(let it=0; it<90; it++){
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i], b=nodes[j];
        let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
        if(d >= MIN) continue;
        if(d < 0.01){ dx = (i%2?1:-1)*0.6; dy = (j%2?1:-1)*0.6; d = Math.hypot(dx,dy); }
        const push = (MIN-d)/2 * 0.45 / d;
        a.x -= dx*push; a.y -= dy*push; b.x += dx*push; b.y += dy*push;
      }
    }
    nodes.forEach(n => { n.x += (n.x0-n.x)*0.03; n.y += (n.y0-n.y)*0.03; });
  }
  nodes.forEach(n => {
    let dx=n.x-n.x0, dy=n.y-n.y0, d=Math.hypot(dx,dy);
    if(d > CAP){ n.x = n.x0 + dx/d*CAP; n.y = n.y0 + dy/d*CAP; }
    n.x = clamp(n.x, VB.l+11, VB.w-VB.r-11);
    n.y = clamp(n.y, VB.t+11, H-VB.b-11);
  });

  let leaders = "", pins = "";
  nodes.forEach(n => {
    if(Math.hypot(n.x-n.x0, n.y-n.y0) > 4){
      leaders += '<line class="lead" x1="' + n.x0.toFixed(1) + '" y1="' + n.y0.toFixed(1) +
                 '" x2="' + n.x.toFixed(1) + '" y2="' + n.y.toFixed(1) + '"/>' +
                 '<circle class="true" cx="' + n.x0.toFixed(1) + '" cy="' + n.y0.toFixed(1) + '" r="1.4"/>';
    }
    pins += pinSVG(n.o, n.x, n.y);
  });

  /* scale bar and north arrow */
  const mPerUnit = 110574/scale;
  let barM = BAR_STEPS[0];
  for(const s of BAR_STEPS){ barM = s; if(s/mPerUnit >= 45) break; }
  const barLen = barM/mPerUnit;
  const bx = VB.l + 4, by = H - VB.b - 8;
  const bar = '<g class="bar"><line x1="' + bx + '" y1="' + by + '" x2="' + (bx+barLen).toFixed(1) +
    '" y2="' + by + '"/><line x1="' + bx + '" y1="' + (by-3) + '" x2="' + bx + '" y2="' + (by+3) + '"/>' +
    '<line x1="' + (bx+barLen).toFixed(1) + '" y1="' + (by-3) + '" x2="' + (bx+barLen).toFixed(1) +
    '" y2="' + (by+3) + '"/><text x="' + (bx+barLen/2).toFixed(1) + '" y="' + (by-6) +
    '" text-anchor="middle" class="tk">' + (barM<1000 ? barM+" m" : (barM/1000)+" km") + '</text></g>';
  const nx = VB.w - VB.r - 12, ny = VB.t + 10;
  const north = '<g class="rose"><line x1="' + nx + '" y1="' + (ny+16) + '" x2="' + nx + '" y2="' + ny +
    '"/><polygon points="' + nx + ',' + (ny-4) + ' ' + (nx-3.2) + ',' + (ny+2) + ' ' +
    (nx+3.2) + ',' + (ny+2) + '"/><text x="' + nx + '" y="' + (ny+26) +
    '" text-anchor="middle" class="tk">N</text></g>';

  host.innerHTML = '<svg viewBox="0 0 ' + VB.w + ' ' + H +
    '" role="img" aria-label="Chart of ' + esc(p.name) + '">' +
    '<g class="gr">' + grid + '</g>' +
    '<rect class="frm" x="' + VB.l + '" y="' + VB.t + '" width="' + iw + '" height="' + ih + '"/>' +
    ticks + route + leaders + bar + north + pins + '</svg>';

  const svg = host.querySelector("svg");
  proj = {svg, W:VB.w, H, mPerUnit,
          toXY:(lat,lon) => ({x:SX(lon*kx), y:SY(-lat)})};
}

/* ============================================================
   The real map — OpenStreetMap tiles under the same pins
   ============================================================ */
function fitZoom(list, W, H){
  if(!list.length) return 16;
  const lats = list.map(o=>o.ll.lat), lons = list.map(o=>o.ll.lon);
  const a = {lat:Math.max(...lats), lon:Math.min(...lons)};
  const b = {lat:Math.min(...lats), lon:Math.max(...lons)};
  for(let z = MAXZ; z >= MINZ; z--){
    const p1 = worldPx(a.lat, a.lon, z), p2 = worldPx(b.lat, b.lon, z);
    if((p2.x-p1.x) <= W*0.84 && (p2.y-p1.y) <= H*0.84) return z;
  }
  return MINZ;
}

function fitPort(){
  const host = $("#viewbox"); if(!host) return;
  const s = chartSets();
  /* frame the town, not the day trips — the far pins are still on the map,
     they are just outside the opening view. */
  const town = s.near.filter(o => layers[o.k]);
  const list = town.length ? town : (s.shown.length ? s.shown : s.all);
  const lats = list.map(o=>o.ll.lat), lons = list.map(o=>o.ll.lon);
  mapView = {
    lat: (Math.max(...lats)+Math.min(...lats))/2,
    lon: (Math.max(...lons)+Math.min(...lons))/2,
    z: fitZoom(list, host.clientWidth || 360, host.clientHeight || 420)
  };
  followMe = false;
}
function centreOn(lat, lon){
  if(!mapView) return;
  mapView.lat = lat; mapView.lon = lon;
  drawMap(); paintMe();
}

function drawMap(){
  const host = $("#viewbox"); if(!host) return;
  if(!host.querySelector(".tiles")){
    tiles = new Map();
    host.innerHTML =
      '<div class="tiles"></div>' +
      '<svg class="ovl"></svg>' +
      '<div class="zoomctl">' +
        '<button data-zoom="1" aria-label="Zoom in">+</button>' +
        '<button data-zoom="-1" aria-label="Zoom out">&minus;</button></div>' +
      '<div class="fsctl"><button data-fullmap="1"></button></div>' +
      '<div class="attrib">&copy; <a href="https://www.openstreetmap.org/copyright" ' +
        'target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>';
    paintFullBtn();
    bindMapGestures(host);
    watchMapSize(host);
  }
  const W = host.clientWidth, H = host.clientHeight;
  if(!W || !H) return;
  if(!mapView) fitPort();

  const c = worldPx(mapView.lat, mapView.lon, mapView.z);
  const oX = c.x - W/2, oY = c.y - H/2;

  /* tiles */
  const layer = host.querySelector(".tiles");
  const tz = clamp(Math.round(mapView.z), MINZ, MAXZ);
  const k = Math.pow(2, mapView.z - tz);
  const n = Math.pow(2, tz), size = 256*k;
  const wx = oX/k, wy = oY/k;
  const tx0 = Math.floor(wx/256), tx1 = Math.floor((wx + W/k)/256);
  const ty0 = Math.floor(wy/256), ty1 = Math.floor((wy + H/k)/256);
  const want = new Set();
  for(let tx = tx0; tx <= tx1; tx++){
    for(let ty = ty0; ty <= ty1; ty++){
      if(ty < 0 || ty >= n) continue;
      const wrap = ((tx % n) + n) % n, key = tz+"/"+wrap+"/"+ty;
      want.add(key);
      let img = tiles.get(key);
      if(!img){
        img = new Image(); img.alt = ""; img.decoding = "async";
        img.addEventListener("error", () => img.classList.add("dead"));
        img.src = TILE_URL.replace("{z}",tz).replace("{x}",wrap).replace("{y}",ty);
        layer.appendChild(img); tiles.set(key, img);
      }
      img.style.width = img.style.height = size.toFixed(2)+"px";
      img.style.left = (tx*256*k - oX).toFixed(2)+"px";
      img.style.top  = (ty*256*k - oY).toFixed(2)+"px";
    }
  }
  tiles.forEach((el, key) => { if(!want.has(key)){ el.remove(); tiles.delete(key); } });

  proj = {svg: host.querySelector(".ovl"), W, H,
          mPerUnit: mPerPx(mapView.lat, mapView.z),
          toXY:(lat,lon) => { const q = worldPx(lat, lon, mapView.z);
                              return {x:q.x-oX, y:q.y-oY}; }};
  proj.svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  drawOverlay();
}

function drawOverlay(){
  if(!proj || !proj.svg) return;
  const {shown} = chartSets();
  let route = "";
  const walk = shown.filter(o => o.k==="walk").sort((a,b)=>a.i-b.i);
  if(walk.length > 1){
    route = '<polyline class="route" points="' + walk.map(o => {
      const q = proj.toXY(o.ll.lat, o.ll.lon);
      return q.x.toFixed(1)+","+q.y.toFixed(1);
    }).join(" ") + '"/>';
  }
  const tour = shown.filter(o => o.k==="taste").sort((a,b)=>a.i-b.i);
  if(tour.length > 1){
    route += '<polyline class="route taste" points="' + tour.map(o => {
      const q = proj.toXY(o.ll.lat, o.ll.lon);
      return q.x.toFixed(1)+","+q.y.toFixed(1);
    }).join(" ") + '"/>';
  }
  const pins = shown.map(o => {
    const q = proj.toXY(o.ll.lat, o.ll.lon);
    return (q.x > -30 && q.x < proj.W+30 && q.y > -30 && q.y < proj.H+30)
      ? pinSVG(o, q.x, q.y) : "";
  }).join("");
  proj.svg.innerHTML = route + pins;
  paintMe();
}

function pinSVG(o, x, y){
  const k = keyOf(o), col = KIND[o.k].col;
  let shape;
  if(o.k === "walk")       shape = '<circle r="9.6" fill="' + col + '"/>';
  else if(o.k === "eat")   shape = '<rect x="-8.4" y="-8.4" width="16.8" height="16.8" fill="' + col + '"/>';
  else if(o.k === "taste") shape = '<polygon points="0,-11.5 10.5,7 -10.5,7" fill="' + col + '"/>';
  else if(o.k === "buy")   shape = '<rect x="-8" y="-8" width="16" height="16" transform="rotate(45)" fill="' + col + '"/>';
  else                     shape = '<circle r="9.8" fill="' + col + '"/>' +
                                   '<circle r="7.2" fill="none" stroke="#FBFAF6" stroke-width="1"/>';
  return '<g class="pin' + (sel===k ? " on" : "") + '" data-pin="' + k +
    '" transform="translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')" role="button" ' +
    'tabindex="0" aria-label="' + esc(o.n) + '">' +
    '<circle class="halo" r="15"/>' + shape +
    '<text y="' + (o.k === "taste" ? "5.4" : "3.3") + '" text-anchor="middle">' + o.num + '</text></g>';
}

/* ============================================================
   Map gestures — drag to pan, pinch or wheel to zoom
   ============================================================ */
function bindMapGestures(host){
  const pts = new Map();
  let last = null, pinch = null, raf = 0;
  const redraw = () => { if(raf) return;
    raf = requestAnimationFrame(() => { raf = 0; drawMap(); paintMe(); }); };

  host.addEventListener("pointerdown", e => {
    if(e.target.closest("[data-zoom],[data-fullmap],[data-pin],.attrib")) return;
    host.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size === 1) last = {x:e.clientX, y:e.clientY};
    if(pts.size === 2){
      const [a,b] = [...pts.values()];
      pinch = {d: Math.hypot(a.x-b.x, a.y-b.y), z: mapView.z};
    }
  });

  host.addEventListener("pointermove", e => {
    if(!pts.has(e.pointerId) || !mapView) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const r = host.getBoundingClientRect();
    if(pts.size === 2 && pinch){
      const [a,b] = [...pts.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if(d > 8){
        followMe = false;
        zoomAt(pinch.z + Math.log2(d/pinch.d),
               (a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top, host);
        redraw();
      }
      return;
    }
    if(pts.size === 1 && last){
      const dx = e.clientX - last.x, dy = e.clientY - last.y;
      if(Math.abs(dx) + Math.abs(dy) < 1) return;
      last = {x:e.clientX, y:e.clientY};
      followMe = false;
      const c = worldPx(mapView.lat, mapView.lon, mapView.z);
      const q = pxToLL(c.x - dx, c.y - dy, mapView.z);
      mapView.lat = clamp(q.lat, -85, 85); mapView.lon = q.lon;
      redraw();
    }
  });

  const end = e => { pts.delete(e.pointerId);
    if(pts.size < 2) pinch = null;
    if(pts.size === 0) last = null; else last = [...pts.values()][0]; };
  host.addEventListener("pointerup", end);
  host.addEventListener("pointercancel", end);

  host.addEventListener("wheel", e => {
    if(!mapView) return;
    e.preventDefault();
    const r = host.getBoundingClientRect();
    followMe = false;
    zoomAt(mapView.z - Math.sign(e.deltaY)*0.5, e.clientX - r.left, e.clientY - r.top, host);
    redraw();
  }, {passive:false});
}

/* The box changes size on full screen, on rotation and on a window drag,
   and only some of those raise a window resize. Watch the box itself. */
function watchMapSize(host){
  if(typeof ResizeObserver !== "function") return;
  let last = "", raf = 0;
  new ResizeObserver(() => {
    if(raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const k = host.clientWidth + "x" + host.clientHeight;
      if(k === last || !host.clientWidth || !host.isConnected) return;
      last = k; drawMap(); paintMe();
    });
  }).observe(host);
}

/* ============================================================
   Full screen — the whole phone for the map. Native fullscreen
   where it exists, a fixed overlay where it does not.
   ============================================================ */
const FS_ICON = {
  in:  '<svg viewBox="0 0 20 20" aria-hidden="true">' +
       '<path d="M8 2H2v6M12 2h6v6M8 18H2v-6M12 18h6v-6"/></svg>',
  out: '<svg viewBox="0 0 20 20" aria-hidden="true">' +
       '<path d="M2 7h5V2M18 7h-5V2M2 13h5v5M18 13h-5v5"/></svg>'
};

function paintFullBtn(){
  const b = document.querySelector("[data-fullmap]"); if(!b) return;
  b.innerHTML = mapFull ? FS_ICON.out : FS_ICON.in;
  b.setAttribute("aria-label", mapFull ? "Leave full screen" : "Full screen map");
  b.setAttribute("aria-pressed", mapFull);
  b.title = mapFull ? "Leave full screen" : "Full screen map";
}

const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;

function enterMapFull(){
  const host = $("#viewbox"); if(!host || mode !== "map" || mapFull) return;
  mapFull = true;
  host.classList.add("fs");
  document.body.classList.add("fsmap");
  const req = host.requestFullscreen || host.webkitRequestFullscreen;
  if(req){ try{ Promise.resolve(req.call(host)).catch(() => {}); }catch(e){} }
  paintFullBtn();
  requestAnimationFrame(() => { drawMap(); paintMe(); });
}

function exitMapFull(){
  if(!mapFull) return;
  mapFull = false;
  const host = $("#viewbox");
  if(host) host.classList.remove("fs");
  document.body.classList.remove("fsmap");
  if(fsElement()){
    const off = document.exitFullscreen || document.webkitExitFullscreen;
    if(off){ try{ Promise.resolve(off.call(document)).catch(() => {}); }catch(e){} }
  }
  paintFullBtn();
  requestAnimationFrame(() => {
    if(tab === "chart" && mode === "map"){ drawMap(); paintMe(); }
  });
}

/* the browser can drop out of fullscreen on its own — Esc, a swipe, a navigation */
["fullscreenchange","webkitfullscreenchange"].forEach(ev =>
  document.addEventListener(ev, () => { if(!fsElement()) exitMapFull(); }));

/* Esc gets us out either way — the browser handles native fullscreen itself,
   the overlay has nobody else to do it */
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && mapFull) exitMapFull();
});

function zoomAt(z, sx, sy, host){
  const W = host.clientWidth, H = host.clientHeight;
  const c0 = worldPx(mapView.lat, mapView.lon, mapView.z);
  const anchor = pxToLL(c0.x - W/2 + sx, c0.y - H/2 + sy, mapView.z);
  mapView.z = clamp(z, MINZ, MAXZ);
  const a = worldPx(anchor.lat, anchor.lon, mapView.z);
  const c = pxToLL(a.x + (W/2 - sx), a.y + (H/2 - sy), mapView.z);
  mapView.lat = clamp(c.lat, -85, 85); mapView.lon = c.lon;
}

/* ============================================================
   GPX — hand the whole port to any map app, offline
   ============================================================ */
function gpxFor(p){
  const x = s => String(s==null?"":s).replace(/[&<>'"]/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&apos;",'"':"&quot;"}[c]));
  const wpts = plotted(p).map(o => {
    const L = ll(o.c);
    return '  <wpt lat="' + L.lat + '" lon="' + L.lon + '">\n' +
      '    <name>' + x(KIND[o.k].t.toUpperCase().slice(0,1) + o.num + " " + o.n) + '</name>\n' +
      '    <desc>' + x((o.sub ? o.sub + " — " : "") + (o.d||"")) + '</desc>\n' +
      '    <type>' + o.k + '</type>\n  </wpt>';
  }).join("\n");
  const rte = '  <rte>\n    <name>' + x(p.name + " — walking order") + '</name>\n' +
    p.stops.filter(s => ll(s.c)).map(s => { const L = ll(s.c);
      return '    <rtept lat="' + L.lat + '" lon="' + L.lon + '"><name>' + x(s.n) + '</name></rtept>';
    }).join("\n") + '\n  </rte>';
  return '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<gpx version="1.1" creator="Shore Book · Adriatic 2026" ' +
    'xmlns="http://www.topografix.com/GPX/1/1">\n' +
    '  <metadata><name>' + x("Shore Book — " + p.name) + '</name></metadata>\n' +
    wpts + '\n' + rte + '\n</gpx>\n';
}

function download(name, text, mime){
  try{
    const url = URL.createObjectURL(new Blob([text], {type:mime}));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }catch(e){
    window.open("data:" + mime + ";charset=utf-8," + encodeURIComponent(text), "_blank");
  }
}

/* ============================================================
   RENDER — panel
   ============================================================ */
function renderPanel(){
  const p = port();
  if(tab === "walk")        $("#panel").innerHTML = renderWalk();
  else if(tab === "eat")    $("#panel").innerHTML = renderCards("eat");
  else if(tab === "taste")  $("#panel").innerHTML = renderTaste();
  else if(tab === "buy")    $("#panel").innerHTML = renderCards("buy");
  else if(tab === "screen") $("#panel").innerHTML = renderCards("screen",
    "What was filmed here, and what only pretends to have been. Everything below is a real location you can stand on unless the card says otherwise.");
  else if(tab === "chart"){ $("#panel").innerHTML = chartShell(); drawView(); }
  else $("#panel").innerHTML = '<ul class="know">' +
    p.know.map(k => "<li>" + esc(k) + "</li>").join("") + "</ul>";
}

function renderAll(){
  renderPortRail(); renderHead(); renderTide(); renderPanel();
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", t.dataset.tab === tab));
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", e => {
  const pb = e.target.closest("[data-port]");
  if(pb){ exitMapFull(); cur = pb.dataset.port; sel = null; mapView = null; followMe = false;
    store.set("sb.port", cur); renderAll(); window.scrollTo(0,0); return; }

  const tb = e.target.closest(".tab");
  if(tb){ exitMapFull(); tab = tb.dataset.tab; renderAll(); return; }

  const md = e.target.closest("[data-setmode]");
  if(md){ if(md.dataset.setmode === mode) return;
    exitMapFull();
    mode = md.dataset.setmode; store.set("sb.mode", mode);
    renderPanel(); return; }

  const lay = e.target.closest("[data-layer]");
  if(lay){ const k = lay.dataset.layer; layers[k] = !layers[k];
    if(sel && sel.split(":")[0] === k && !layers[k]) sel = null;
    renderPanel(); return; }

  const fit = e.target.closest("[data-fit]");
  if(fit){ fitAll = !fitAll; renderPanel(); return; }

  const fp = e.target.closest("[data-fitport]");
  if(fp){ fitPort(); drawMap(); paintMe(); paintLocBar(); return; }

  const fs = e.target.closest("[data-fullmap]");
  if(fs){ mapFull ? exitMapFull() : enterMapFull(); return; }

  const zm = e.target.closest("[data-zoom]");
  if(zm){ const host = $("#viewbox");
    if(host && mapView){ followMe = false;
      zoomAt(mapView.z + (+zm.dataset.zoom), host.clientWidth/2, host.clientHeight/2, host);
      drawMap(); paintMe(); }
    return; }

  const gb = e.target.closest("[data-geo]");
  if(gb){ const what = gb.dataset.geo;
    if(what === "on") startGeo();
    else if(what === "off") stopGeo();
    else if(what === "follow"){ followMe = !followMe;
      if(followMe && geo.fix){ mapView.z = Math.max(mapView.z, 17);
        centreOn(geo.fix.lat, geo.fix.lon); }
      paintLocBar(); }
    return; }

  const gp = e.target.closest("[data-gpx]");
  if(gp){ const p = port();
    download("shore-book-" + p.id + ".gpx", gpxFor(p), "application/gpx+xml"); return; }

  const pin = e.target.closest("[data-pin]");
  if(pin){ selectPin(pin.dataset.pin, false);
    const c = sel && $("#card-" + CSS.escape(sel));
    if(c) c.scrollIntoView({block:"nearest", behavior:"smooth"});
    return; }

  const go = e.target.closest("[data-goto]");
  if(go){ const k = go.dataset.goto;
    if(tab === "chart"){ selectPin(k, true); }
    else { sel = k; tab = "chart"; renderAll();
      if(mode === "map") selectPin(k, true);
      window.scrollTo({top:0, behavior:"smooth"}); }
    return; }

  const chk = e.target.closest("[data-check]");
  if(chk){
    const i = +chk.dataset.check, d = getDone();
    const k = d.indexOf(i); k > -1 ? d.splice(k,1) : d.push(i);
    setDone(d); renderPanel(); return;
  }

  const op = e.target.closest("[data-open]");
  if(op){ op.parentElement.classList.toggle("open"); return; }
});

/* pins are SVG groups — give them a keyboard */
document.addEventListener("keydown", e => {
  if(e.key !== "Enter" && e.key !== " ") return;
  const pin = e.target.closest && e.target.closest("g[data-pin]");
  if(!pin) return;
  e.preventDefault();
  selectPin(pin.dataset.pin, false);
});

/* the map is sized in CSS pixels, so it has to be redrawn when they change */
let rz = 0;
window.addEventListener("resize", () => {
  if(tab !== "chart" || mode !== "map") return;
  clearTimeout(rz); rz = setTimeout(() => { drawMap(); paintMe(); }, 150);
});

$("#ashore").addEventListener("change", e => {
  store.set(timeKey(cur,"ashore"), e.target.value); renderTide(); renderPanel(); });
$("#allAboard").addEventListener("change", e => {
  store.set(timeKey(cur,"aboard"), e.target.value); renderTide(); renderPanel(); });
$("#reset").addEventListener("click", () => { setDone([]); renderPanel(); });

const d = new Date();
$("#today").textContent = d.toLocaleDateString("en-GB",
  {weekday:"short", day:"numeric", month:"short"});

renderAll();
setInterval(() => { renderTide(); if(tab==="walk") renderPanel(); }, 60000);

/* If location was on last time the permission is already granted — resume quietly. */
if(store.get("sb.geo") === "1") startGeo();

/* Offline: cache the app on first load so it runs with no signal. */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
